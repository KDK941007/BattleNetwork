<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>BattleNetwork Prototype</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<main class="shell">
  <footer class="footer">
    <div class="chipHud"><span class="chipNow" id="chipNow">チップ</span><div class="queue" id="queue"></div></div>
    <button class="gear" id="gear" type="button" aria-label="設定">
      <svg class="cyberGear" viewBox="0 0 32 32" aria-hidden="true">
        <path class="outer" d="M13 2h6l1.2 4.1 3.1 1.3 3.8-2.1 4.2 4.2-2.1 3.8 1.3 3.1L34 17v6l-3.5.6-1.3 3.1 2.1 3.8-4.2 4.2-3.8-2.1-3.1 1.3L19 38h-6l-1.2-4.1-3.1-1.3-3.8 2.1-4.2-4.2 2.1-3.8-1.3-3.1L-2 23v-6l3.5-.6 1.3-3.1-2.1-3.8 4.2-4.2 3.8 2.1 3.1-1.3z" transform="scale(.78) translate(4.7 1.7)"/>
        <path class="inner" d="M16 10l5 3v6l-5 3-5-3v-6z"/>
        <path class="circuit" d="M16 5v5M27 16h-6M16 27v-5M5 16h6"/>
        <circle class="node" cx="16" cy="5" r="1.3"/><circle class="node" cx="27" cy="16" r="1.3"/><circle class="node" cx="16" cy="27" r="1.3"/><circle class="node" cx="5" cy="16" r="1.3"/>
      </svg>
    </button>
  </footer>
  <div class="customGauge" id="customGauge" role="button" aria-label="CUSTOM"><div class="customFill" id="customFill"></div><div class="customLabel" id="customLabel"></div></div>
  <section class="battle" id="battle">
    <div class="scene" id="scene"><div class="floor"></div><div class="rangePreview cannonPreview" id="cannonPreview"></div><div class="rangePreview meleePreview" id="meleePreview"></div><div class="rangePreview bombPath" id="bombPath"></div><div class="bombTarget" id="bombTarget"></div><div class="player" id="player"></div><div class="arrow" id="arrow"></div></div>
    <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
    <button class="act" id="Y">Y</button><button class="act" id="X">X</button><button class="act" id="B">B</button><button class="act" id="A">A</button>
    <div class="editShade" id="editShade" hidden></div><div class="selectionLabel" id="selectionLabel"></div>
    <div class="editTopBar" id="editTopBar"><span class="label">配置編集</span><button id="resetSettings" class="resetSettings" type="button">デフォルトに戻す</button><button id="doneSettings" class="doneSettings" type="button">完了</button></div>
    <div class="opacityFloat" id="opacityFloat"><div class="title"><span id="selectedName">未選択</span><span id="opacityValue">100%</span></div><input id="opacitySlider" type="range" min="20" max="100" step="5" value="100"></div>
    <div class="modal" id="customModal"><div class="customPanel"><div class="customHead"><h2>CUSTOM</h2><span id="folderInfo"></span></div><div class="handViewport"><div class="hand" id="hand"></div></div><div class="instruction">タップで選択／再タップでキャンセル。長押しでチップ詳細を表示。</div><div class="customActions"><button class="sendBtn" id="send">決定</button><button class="soulBtn" disabled>ソウルユニゾン</button></div></div></div>
    <div class="modal chipDetailModal" id="chipDetailModal"><div class="chipDetail"><div class="chipDetailHead"><h3 id="detailName">チップ詳細</h3><button class="chipDetailClose" id="detailClose" type="button" aria-label="詳細を閉じる">×</button></div><div class="chipDetailBody"><div class="detailArt" id="detailArt"></div><div class="detailText"><div class="detailRow"><span class="detailLabel">属性・系統</span><span class="detailValue" id="detailAttr"></span></div><div class="detailRow"><span class="detailLabel">チップの内容</span><span class="detailValue" id="detailDesc"></span></div><div class="detailRow"><span class="detailLabel">範囲</span><span class="detailValue" id="detailRangeText"></span></div></div></div><div class="rangeTitle">範囲イメージ</div><div class="rangeViz" id="detailRange"><span class="rangePlayer">自分</span><span class="vizLine"></span><span class="vizBox"></span><span class="vizArc"></span><span class="vizTarget"></span><span class="vizHeal"></span></div></div></div>
    <div class="modal" id="settingsModal"><div class="settings"><div class="settingsHead"><b>設定</b><button id="closeSettings" class="settingsClose" type="button" aria-label="設定を閉じる">×</button></div><div class="settingsList"><button id="controllerSettingsItem" class="settingsItem" type="button">コントローラー設定<small>配置・サイズ・透明度を変更</small></button></div></div></div>
  </section>
</main>
<div class="portrait">端末を横向きにしてください</div>
<script src="./js/game.js"></script>
<script src="./js/service-worker-register.js"></script>
</body>
</html>
