<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store,must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>BattleNetwork Movement Prototype</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111b}
    body{padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
    button{font:inherit}
    .gameShell{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr;gap:6px}
    .statusBar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:38px;padding:4px 8px 4px 10px;border:1px solid rgba(90,214,255,.35);border-radius:8px;background:rgba(3,17,28,.92);color:#dff7ff;font-size:13px;font-weight:700;letter-spacing:.04em}
    .statusRight{display:flex;align-items:center;gap:8px}
    .statusHint{color:#7bcce7;font-size:11px;font-weight:600}
    .settingsButton{display:grid;place-items:center;width:34px;height:34px;padding:0;border-radius:8px;border:1px solid rgba(127,224,255,.5);background:#0c2634;color:#e8fbff;font-size:20px;line-height:1}
    .settingsButton span{display:block;line-height:1;transform:translateY(-.5px)}
    .battleArea{position:relative;width:100%;min-height:0;overflow:hidden;border:2px solid rgba(84,221,255,.45);border-radius:12px;background:linear-gradient(180deg,#0b1a24,#061018);box-shadow:0 0 28px rgba(30,188,255,.14) inset}
    .scene{position:absolute;left:0;top:0;width:5184px;height:2592px;will-change:transform}
    .floor{position:absolute;inset:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:repeating-linear-gradient(26.565deg,rgba(83,194,222,.14) 0 2px,transparent 2px 72px),repeating-linear-gradient(153.435deg,rgba(83,194,222,.12) 0 2px,transparent 2px 72px),linear-gradient(180deg,rgba(58,130,151,.28),rgba(17,63,79,.32) 48%,rgba(7,27,38,.6)),#0b2531}
    .floorBorder{position:absolute;inset:0;pointer-events:none;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%,50% 0,50.18% .35%,.36% 50%,50% 99.65%,99.64% 50%,50% .35%);background:rgba(104,225,249,.34)}
    .centerMark{position:absolute;left:50%;top:50%;width:160px;height:80px;transform:translate(-50%,-50%);border:2px solid rgba(116,225,246,.24);background:rgba(70,178,203,.04);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
    .player{position:absolute;left:0;top:0;width:clamp(34px,5.2vw,46px);height:clamp(42px,6.3vw,58px);border-radius:16px 16px 11px 11px;background:linear-gradient(90deg,transparent 0 20%,rgba(255,255,255,.4) 20% 32%,transparent 32%),linear-gradient(180deg,#51d7ff,#1d8df2 44%,#163f8b);border:2px solid rgba(193,247,255,.85);box-shadow:0 0 12px rgba(64,203,255,.85),0 7px 0 rgba(0,0,0,.2);transform-origin:50% 100%;will-change:transform;z-index:3}
    .player.dashing{filter:brightness(1.45);box-shadow:0 0 22px rgba(112,235,255,.95),0 7px 0 rgba(0,0,0,.2)}
    .player:before{content:"";position:absolute;left:22%;right:22%;top:15%;height:23%;border-radius:8px;background:#081d4e}
    .player:after{content:"";position:absolute;left:50%;bottom:-10px;width:96%;height:13px;border-radius:50%;background:rgba(0,0,0,.38);transform:translateX(-50%) skewX(-18deg);filter:blur(2px);z-index:-1}
    .joystick{position:absolute;left:18px;bottom:16px;width:clamp(112px,16vw,150px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(73,210,255,.14) 0 48%,transparent 49%),rgba(8,31,42,.72);border:2px solid rgba(76,202,245,.42);z-index:10;transform-origin:center}
    .joystick:before,.joystick:after{content:"";position:absolute;background:rgba(91,217,255,.16)}
    .joystick:before{width:2px;top:12%;bottom:12%;left:50%}.joystick:after{height:2px;left:12%;right:12%;top:50%}
    .joystickKnob{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9aedff,#3299d8 50%,#155278);border:2px solid rgba(221,251,255,.9);transform:translate(-50%,-50%);pointer-events:none}
    .actionPad{position:absolute;right:8px;bottom:16px;width:clamp(170px,23vw,220px);aspect-ratio:1;z-index:11;transform-origin:center}
    .actionButton{position:absolute;width:clamp(54px,7.5vw,68px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(210,248,255,.82);background:radial-gradient(circle at 35% 30%,rgba(135,231,255,.3),rgba(29,94,128,.9) 58%,rgba(8,34,52,.96));color:#eefcff;font-size:clamp(18px,2.6vw,24px);font-weight:900}
    .actionButton.y{left:50%;top:0;transform:translateX(-50%)}.actionButton.x{left:0;top:50%;transform:translateY(-50%)}.actionButton.b{right:0;top:50%;transform:translateY(-50%)}.actionButton.a{left:50%;bottom:0;transform:translateX(-50%)}
    .actionButton.y:active,.actionButton.y.pressed,.actionButton.a:active,.actionButton.a.pressed{transform:translateX(-50%) scale(.92)}.actionButton.x:active,.actionButton.x.pressed,.actionButton.b:active,.actionButton.b.pressed{transform:translateY(-50%) scale(.92)}
    .actionButton.cooldown{opacity:.42}
    .editTarget{outline:3px solid rgba(255,226,102,.95);outline-offset:6px;filter:drop-shadow(0 0 10px rgba(255,217,77,.45))}
    .editMode .joystick,.editMode .actionPad{cursor:move}
    .editShade{position:absolute;inset:0;z-index:20;pointer-events:none;background:rgba(1,8,13,.12)}
    .editToolbar{position:absolute;left:50%;top:10px;z-index:60;display:none;min-width:min(520px,92%);transform:translateX(-50%);padding:10px 12px;border:1px solid rgba(120,222,255,.5);border-radius:12px;background:rgba(5,24,34,.95);color:#effcff;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .editToolbar.open{display:block}.editTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:800}.editHelp{margin-top:4px;color:#9bd9eb;font-size:11px;font-weight:600}.opacityRow{display:grid;grid-template-columns:auto 1fr 44px;align-items:center;gap:8px;margin-top:9px;font-size:12px}.opacityRow input{width:100%;touch-action:auto}.editActions{display:flex;justify-content:flex-end;gap:8px;margin-top:9px}.editActions button{min-height:34px;padding:0 12px;border-radius:8px;font-weight:700}.resetSettings{border:1px solid rgba(255,190,120,.5);background:#3b2818;color:#ffe5c6}.doneSettings{border:1px solid rgba(112,220,255,.5);background:#12384a;color:#eaffff}
    .selectionLabel{position:absolute;z-index:59;display:none;padding:4px 8px;border-radius:7px;background:rgba(255,220,86,.95);color:#182028;font-size:11px;font-weight:900;pointer-events:none}.selectionLabel.show{display:block}
    .portraitNotice{display:none}@media(orientation:portrait){.portraitNotice{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#07111b;color:#dff7ff;font-size:18px;font-weight:700}}
  </style>
</head>
<body>
<main class="gameShell">
  <header class="statusBar"><span>ACTION TEST</span><div class="statusRight"><span class="statusHint">左：移動 / 右：A B X Y</span><button id="settingsButton" class="settingsButton" type="button" aria-label="コントローラー設定"><span>⚙</span></button></div></header>
  <section class="battleArea" id="battleArea">
    <div class="scene" id="scene"><div class="floor"></div><div class="floorBorder"></div><div class="centerMark"></div><div class="player" id="player"></div></div>
    <div class="joystick" id="joystick"><div class="joystickKnob" id="joystickKnob"></div></div>
    <div class="actionPad" id="actionPad"><button class="actionButton y" id="buttonY" type="button">Y</button><button class="actionButton x" id="buttonX" type="button">X</button><button class="actionButton b" id="buttonB" type="button">B</button><button class="actionButton a" id="buttonA" type="button">A</button></div>
    <div class="editShade" id="editShade" hidden></div><div class="selectionLabel" id="selectionLabel"></div>
    <div class="editToolbar" id="editToolbar"><div class="editTitle"><span>コントローラー配置編集</span><span id="selectedName">未選択</span></div><div class="editHelp">移動：対象を1本指でドラッグ　/　サイズ：対象を2本指でピンチ</div><div class="opacityRow"><span>透明度</span><input id="opacitySlider" type="range" min="20" max="100" step="5" value="100"><span id="opacityValue">100%</span></div><div class="editActions"><button id="resetSettings" class="resetSettings" type="button">デフォルトに戻す</button><button id="doneSettings" class="doneSettings" type="button">完了</button></div></div>
  </section>
</main>
<div class="portraitNotice">端末を横向きにしてください</div>
<script>
(()=>{
const battleArea=document.getElementById('battleArea'),scene=document.getElementById('scene'),player=document.getElementById('player'),joystick=document.getElementById('joystick'),knob=document.getElementById('joystickKnob'),actionPad=document.getElementById('actionPad'),buttonX=document.getElementById('buttonX');
const settingsButton=document.getElementById('settingsButton'),editToolbar=document.getElementById('editToolbar'),editShade=document.getElementById('editShade'),selectedName=document.getElementById('selectedName'),opacitySlider=document.getElementById('opacitySlider'),opacityValue=document.getElementById('opacityValue'),resetSettings=document.getElementById('resetSettings'),doneSettings=document.getElementById('doneSettings'),selectionLabel=document.getElementById('selectionLabel');
const WORLD_SIZE=3600,PROJ_X=.72,PROJ_Y=.36,SCENE_WIDTH=WORLD_SIZE*PROJ_X*2,SCENE_HEIGHT=WORLD_SIZE*PROJ_Y*2,SPEED=260,DEAD_ZONE=.12,CAMERA_FOLLOW=.14,DASH_DISTANCE=360,DASH_DURATION=.13,DASH_COOLDOWN=.65;
const defaults={left:{x:18,y:16,scale:1,opacity:1},right:{x:8,y:16,scale:1,opacity:1}};let controlSettings=loadSettings(),editMode=false,selectedKey=null;
const state={x:WORLD_SIZE*.5,y:WORLD_SIZE*.5,inputX:0,inputY:0,lastDirX:1,lastDirY:0,pointerId:null,cameraX:0,cameraY:0,lastTime:performance.now(),dashRemaining:0,dashCooldown:0,dashVelX:0,dashVelY:0};
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v)),lerp=(a,b,t)=>a+(b-a)*t;
function cloneDefaults(){return JSON.parse(JSON.stringify(defaults))}function loadSettings(){try{const saved=JSON.parse(localStorage.getItem('battleNetworkControlsV2'));return saved&&saved.left&&saved.right?saved:cloneDefaults()}catch{return cloneDefaults()}}function saveSettings(){localStorage.setItem('battleNetworkControlsV2',JSON.stringify(controlSettings))}
function applyControls(){joystick.style.left=controlSettings.left.x+'px';joystick.style.bottom=controlSettings.left.y+'px';joystick.style.transform=`scale(${controlSettings.left.scale})`;joystick.style.opacity=controlSettings.left.opacity;actionPad.style.right=controlSettings.right.x+'px';actionPad.style.bottom=controlSettings.right.y+'px';actionPad.style.transform=`scale(${controlSettings.right.scale})`;actionPad.style.opacity=controlSettings.right.opacity;updateSelectionLabel()}
function project(x,y){return{x:(x-y)*PROJ_X+SCENE_WIDTH/2,y:(x+y)*PROJ_Y}}function screenInputToWorld(sx,sy){let wx=(sx/PROJ_X+sy/PROJ_Y)/2,wy=(sy/PROJ_Y-sx/PROJ_X)/2;const l=Math.hypot(wx,wy);if(l){wx/=l;wy/=l}return{x:wx,y:wy}}
function getCameraTarget(){const v=battleArea.getBoundingClientRect(),p=project(state.x,state.y);return{x:clamp(p.x-v.width/2,0,Math.max(0,SCENE_WIDTH-v.width)),y:clamp(p.y-v.height*.58,0,Math.max(0,SCENE_HEIGHT-v.height))}}
function render(){const p=project(state.x,state.y);player.style.transform=`translate3d(${p.x-player.offsetWidth/2}px,${p.y-player.offsetHeight}px,0)`;scene.style.transform=`translate3d(${-state.cameraX}px,${-state.cameraY}px,0)`;buttonX.classList.toggle('cooldown',state.dashCooldown>0)}function initCamera(){const t=getCameraTarget();state.cameraX=t.x;state.cameraY=t.y;render()}
function setJoy(e){if(editMode)return;const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.335,d=Math.hypot(dx,dy),s=d>max?max/d:1,lx=dx*s,ly=dy*s,m=Math.hypot(lx/max,ly/max);if(m<DEAD_ZONE){state.inputX=state.inputY=0}else{const w=screenInputToWorld(lx/max,ly/max);state.inputX=w.x*m;state.inputY=w.y*m;state.lastDirX=w.x;state.lastDirY=w.y}knob.style.transform=`translate(calc(-50% + ${lx}px),calc(-50% + ${ly}px))`}function resetJoy(){state.inputX=state.inputY=0;state.pointerId=null;knob.style.transform='translate(-50%,-50%)'}
joystick.addEventListener('pointerdown',e=>{if(editMode)return;if(state.pointerId!==null)return;state.pointerId=e.pointerId;joystick.setPointerCapture(e.pointerId);setJoy(e)});joystick.addEventListener('pointermove',e=>{if(!editMode&&e.pointerId===state.pointerId)setJoy(e)});joystick.addEventListener('pointerup',e=>{if(!editMode&&e.pointerId===state.pointerId)resetJoy()});joystick.addEventListener('pointercancel',resetJoy);joystick.addEventListener('lostpointercapture',resetJoy);
function dash(){if(editMode||state.dashCooldown>0||state.dashRemaining>0)return;let dx=state.inputX,dy=state.inputY,l=Math.hypot(dx,dy);if(l<DEAD_ZONE){dx=state.lastDirX;dy=state.lastDirY;l=Math.hypot(dx,dy)}if(!l)return;dx/=l;dy/=l;state.lastDirX=dx;state.lastDirY=dy;const ds=DASH_DISTANCE/DASH_DURATION;state.dashVelX=dx*ds;state.dashVelY=dy*ds;state.dashRemaining=DASH_DURATION;state.dashCooldown=DASH_COOLDOWN;player.classList.add('dashing');setTimeout(()=>player.classList.remove('dashing'),DASH_DURATION*1000)}buttonX.addEventListener('pointerdown',e=>{if(!editMode){e.preventDefault();dash()}});
['buttonA','buttonB','buttonY'].forEach(id=>{const b=document.getElementById(id);b.addEventListener('pointerdown',()=>{if(!editMode)b.classList.add('pressed')});const rel=()=>b.classList.remove('pressed');b.addEventListener('pointerup',rel);b.addEventListener('pointercancel',rel);b.addEventListener('pointerleave',rel)});
function update(t){const dt=Math.min((t-state.lastTime)/1000,.05);state.lastTime=t;if(!editMode){if(state.dashCooldown>0)state.dashCooldown=Math.max(0,state.dashCooldown-dt);if(state.dashRemaining>0){const s=Math.min(dt,state.dashRemaining);state.x+=state.dashVelX*s;state.y+=state.dashVelY*s;state.dashRemaining-=s}else{state.x+=state.inputX*SPEED*dt;state.y+=state.inputY*SPEED*dt}state.x=clamp(state.x,0,WORLD_SIZE);state.y=clamp(state.y,0,WORLD_SIZE)}const target=getCameraTarget(),f=1-Math.pow(1-CAMERA_FOLLOW,dt*60);state.cameraX=lerp(state.cameraX,target.x,f);state.cameraY=lerp(state.cameraY,target.y,f);render();requestAnimationFrame(update)}
function targetFor(key){return key==='left'?joystick:actionPad}function selectTarget(key){selectedKey=key;joystick.classList.toggle('editTarget',key==='left');actionPad.classList.toggle('editTarget',key==='right');selectedName.textContent=key==='left'?'左スティック':'右ボタン';opacitySlider.value=Math.round(controlSettings[key].opacity*100);opacityValue.textContent=opacitySlider.value+'%';updateSelectionLabel()}
function updateSelectionLabel(){if(!editMode||!selectedKey){selectionLabel.classList.remove('show');return}const r=targetFor(selectedKey).getBoundingClientRect(),a=battleArea.getBoundingClientRect();selectionLabel.textContent=selectedKey==='left'?'左スティック':'右ボタン';selectionLabel.style.left=Math.max(6,r.left-a.left)+'px';selectionLabel.style.top=Math.max(6,r.top-a.top-28)+'px';selectionLabel.classList.add('show')}
function enterEdit(){editMode=true;resetJoy();battleArea.classList.add('editMode');editToolbar.classList.add('open');editShade.hidden=false;selectTarget(selectedKey||'left')}function leaveEdit(){editMode=false;battleArea.classList.remove('editMode');editToolbar.classList.remove('open');editShade.hidden=true;joystick.classList.remove('editTarget');actionPad.classList.remove('editTarget');selectionLabel.classList.remove('show');selectedKey=null;saveSettings()}
settingsButton.addEventListener('click',enterEdit);doneSettings.addEventListener('click',leaveEdit);opacitySlider.addEventListener('input',()=>{if(!selectedKey)return;controlSettings[selectedKey].opacity=Number(opacitySlider.value)/100;opacityValue.textContent=opacitySlider.value+'%';applyControls();saveSettings()});resetSettings.addEventListener('click',()=>{controlSettings=cloneDefaults();applyControls();selectTarget(selectedKey||'left');saveSettings()});
function makeEditable(el,key){const pointers=new Map();let start=null,pinchStart=null;el.addEventListener('pointerdown',e=>{if(!editMode)return;e.preventDefault();selectTarget(key);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});el.setPointerCapture(e.pointerId);if(pointers.size===1){const p=[...pointers.values()][0];start={x:p.x,y:p.y,baseX:controlSettings[key].x,baseY:controlSettings[key].y}}else if(pointers.size===2){const [a,b]=[...pointers.values()];pinchStart={distance:Math.hypot(b.x-a.x,b.y-a.y),scale:controlSettings[key].scale}}});el.addEventListener('pointermove',e=>{if(!editMode||!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&start){const p=[...pointers.values()][0],dx=p.x-start.x,dy=p.y-start.y;if(key==='left'){controlSettings.left.x=clamp(start.baseX+dx,-40,battleArea.clientWidth-70);controlSettings.left.y=clamp(start.baseY-dy,-40,battleArea.clientHeight-70)}else{controlSettings.right.x=clamp(start.baseX-dx,-40,battleArea.clientWidth-70);controlSettings.right.y=clamp(start.baseY-dy,-40,battleArea.clientHeight-70)}applyControls()}else if(pointers.size===2&&pinchStart){const [a,b]=[...pointers.values()],d=Math.hypot(b.x-a.x,b.y-a.y);controlSettings[key].scale=clamp(pinchStart.scale*(d/pinchStart.distance),.6,1.6);applyControls()}});const end=e=>{if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(pointers.size===1){const p=[...pointers.values()][0];start={x:p.x,y:p.y,baseX:controlSettings[key].x,baseY:controlSettings[key].y};pinchStart=null}else if(!pointers.size){start=null;pinchStart=null;saveSettings()}else if(pointers.size===2){const[a,b]=[...pointers.values()];pinchStart={distance:Math.hypot(b.x-a.x,b.y-a.y),scale:controlSettings[key].scale}}};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
makeEditable(joystick,'left');makeEditable(actionPad,'right');window.addEventListener('resize',()=>{initCamera();updateSelectionLabel()});applyControls();render();initCamera();requestAnimationFrame(update);
})();
</script>
<script>
(()=>{if(!('serviceWorker'in navigator))return;let registrationRef=null;async function checkForUpdate(){if(!navigator.onLine)return;try{const registration=registrationRef||await navigator.serviceWorker.getRegistration('./');if(registration){registrationRef=registration;await registration.update()}}catch(error){console.warn('Service Worker update check failed:',error)}}window.addEventListener('load',async()=>{try{registrationRef=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});await checkForUpdate()}catch(error){console.warn('Service Worker registration failed:',error)}});window.addEventListener('pageshow',checkForUpdate);window.addEventListener('online',checkForUpdate);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkForUpdate()})})();
</script>
</body>
</html>
