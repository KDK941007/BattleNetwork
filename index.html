<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>BattleNetwork Movement Prototype</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111b}body{padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}button{font:inherit}.gameShell{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr;gap:6px}.statusBar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:38px;padding:4px 8px 4px 10px;border:1px solid rgba(90,214,255,.35);border-radius:8px;background:rgba(3,17,28,.92);color:#dff7ff;font-size:13px;font-weight:700;letter-spacing:.04em}.statusRight{display:flex;align-items:center;gap:8px}.statusHint{color:#7bcce7;font-size:11px;font-weight:600}.settingsButton{display:grid;place-items:center;width:34px;height:34px;padding:0;border-radius:8px;border:1px solid rgba(127,224,255,.5);background:#0c2634;color:#e8fbff;font-size:20px;line-height:1}.settingsButton span{display:block;line-height:1;transform:translateY(-.5px)}.battleArea{position:relative;width:100%;min-height:0;overflow:hidden;border:2px solid rgba(84,221,255,.45);border-radius:12px;background:linear-gradient(180deg,#0b1a24,#061018);box-shadow:0 0 28px rgba(30,188,255,.14) inset}.scene{position:absolute;left:0;top:0;width:5184px;height:2592px;will-change:transform}.floor{position:absolute;inset:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:repeating-linear-gradient(26.565deg,rgba(83,194,222,.14) 0 2px,transparent 2px 72px),repeating-linear-gradient(153.435deg,rgba(83,194,222,.12) 0 2px,transparent 2px 72px),linear-gradient(180deg,rgba(58,130,151,.28),rgba(17,63,79,.32) 48%,rgba(7,27,38,.6)),#0b2531}.floorBorder{position:absolute;inset:0;pointer-events:none;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%,50% 0,50.18% .35%,.36% 50%,50% 99.65%,99.64% 50%,50% .35%);background:rgba(104,225,249,.34)}.centerMark{position:absolute;left:50%;top:50%;width:160px;height:80px;transform:translate(-50%,-50%);border:2px solid rgba(116,225,246,.24);background:rgba(70,178,203,.04);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.player{position:absolute;left:0;top:0;width:clamp(34px,5.2vw,46px);height:clamp(42px,6.3vw,58px);border-radius:16px 16px 11px 11px;background:linear-gradient(90deg,transparent 0 20%,rgba(255,255,255,.4) 20% 32%,transparent 32%),linear-gradient(180deg,#51d7ff,#1d8df2 44%,#163f8b);border:2px solid rgba(193,247,255,.85);box-shadow:0 0 12px rgba(64,203,255,.85),0 7px 0 rgba(0,0,0,.2);transform-origin:50% 100%;will-change:transform;z-index:3}.player.dashing{filter:brightness(1.45);box-shadow:0 0 22px rgba(112,235,255,.95),0 7px 0 rgba(0,0,0,.2)}.player:before{content:"";position:absolute;left:22%;right:22%;top:15%;height:23%;border-radius:8px;background:#081d4e}.player:after{content:"";position:absolute;left:50%;bottom:-10px;width:96%;height:13px;border-radius:50%;background:rgba(0,0,0,.38);transform:translateX(-50%) skewX(-18deg);filter:blur(2px);z-index:-1}.joystick{position:absolute;left:18px;bottom:16px;width:clamp(112px,16vw,150px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(73,210,255,.14) 0 48%,transparent 49%),rgba(8,31,42,.72);border:2px solid rgba(76,202,245,.42);z-index:10;transform-origin:center}.joystick:before,.joystick:after{content:"";position:absolute;background:rgba(91,217,255,.16)}.joystick:before{width:2px;top:12%;bottom:12%;left:50%}.joystick:after{height:2px;left:12%;right:12%;top:50%}.joystickKnob{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9aedff,#3299d8 50%,#155278);border:2px solid rgba(221,251,255,.9);transform:translate(-50%,-50%);pointer-events:none}.actionButton{position:absolute;width:clamp(54px,7.5vw,68px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(210,248,255,.82);background:radial-gradient(circle at 35% 30%,rgba(135,231,255,.3),rgba(29,94,128,.9) 58%,rgba(8,34,52,.96));color:#eefcff;font-size:clamp(18px,2.6vw,24px);font-weight:900;z-index:11;transform-origin:center}.actionButton:active,.actionButton.pressed{filter:brightness(1.25)}.actionButton.cooldown{opacity:.42}.editTarget{outline:3px solid rgba(255,226,102,.95);outline-offset:6px;filter:drop-shadow(0 0 10px rgba(255,217,77,.45))}.editMode .joystick,.editMode .actionButton{cursor:move}.editShade{position:absolute;inset:0;z-index:20;pointer-events:none;background:rgba(1,8,13,.08)}.editTopBar{position:absolute;left:50%;top:8px;z-index:60;display:none;align-items:center;gap:8px;transform:translateX(-50%);padding:6px 8px;border:1px solid rgba(120,222,255,.5);border-radius:10px;background:rgba(5,24,34,.92);color:#effcff}.editTopBar.open{display:flex}.editTopBar .label{font-size:12px;font-weight:800;white-space:nowrap}.editTopBar button{height:30px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:800}.resetSettings{border:1px solid rgba(255,190,120,.5);background:#3b2818;color:#ffe5c6}.doneSettings{border:1px solid rgba(112,220,255,.5);background:#12384a;color:#eaffff}.opacityFloat{position:absolute;left:50%;bottom:8px;z-index:61;display:none;width:min(210px,34vw);transform:translateX(-50%);padding:6px 8px;border:1px solid rgba(120,222,255,.45);border-radius:9px;background:rgba(5,24,34,.88);color:#effcff}.opacityFloat.show{display:block}.opacityFloat .title{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;font-size:10px;font-weight:800}.opacityFloat input{width:100%;touch-action:auto}.selectionLabel{position:absolute;z-index:59;display:none;padding:4px 8px;border-radius:7px;background:rgba(255,220,86,.95);color:#182028;font-size:11px;font-weight:900;pointer-events:none}.selectionLabel.show{display:block}.settingsMenuOverlay{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(2,10,16,.72)}.settingsMenuOverlay.open{display:flex}.settingsMenu{width:min(360px,82vw);padding:12px;border:1px solid rgba(112,220,255,.48);border-radius:14px;background:rgba(6,28,39,.97);color:#effcff;box-shadow:0 12px 36px rgba(0,0,0,.45)}.settingsMenuHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.settingsMenuHeader h2{margin:0;font-size:16px;letter-spacing:.04em}.settingsMenuClose{display:grid;place-items:center;width:32px;height:32px;padding:0;border:1px solid rgba(140,226,255,.45);border-radius:8px;background:#102f40;color:#fff;font-size:20px;line-height:1}.settingsMenuList{display:grid;gap:8px}.settingsMenuItem{width:100%;min-height:48px;padding:8px 12px;border:1px solid rgba(103,205,236,.38);border-radius:10px;background:linear-gradient(180deg,#12384a,#0b2938);color:#effcff;text-align:left;font-weight:800}.settingsMenuItem small{display:block;margin-top:3px;color:#8fd8ed;font-size:10px;font-weight:600}.portraitNotice{display:none}@media(orientation:portrait){.portraitNotice{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#07111b;color:#dff7ff;font-size:18px;font-weight:700}}
</style>
</head>
<body>
<main class="gameShell"><header class="statusBar"><span>ACTION TEST</span><div class="statusRight"><span class="statusHint">左：移動 / 右：A B X Y</span><button id="settingsButton" class="settingsButton" type="button" aria-label="設定"><span>⚙</span></button></div></header><section class="battleArea" id="battleArea"><div class="scene" id="scene"><div class="floor"></div><div class="floorBorder"></div><div class="centerMark"></div><div class="player" id="player"></div></div><div class="joystick" id="joystick"><div class="joystickKnob" id="joystickKnob"></div></div><button class="actionButton" id="buttonY" type="button">Y</button><button class="actionButton" id="buttonX" type="button">X</button><button class="actionButton" id="buttonB" type="button">B</button><button class="actionButton" id="buttonA" type="button">A</button><div class="editShade" id="editShade" hidden></div><div class="selectionLabel" id="selectionLabel"></div><div class="editTopBar" id="editTopBar"><span class="label">配置編集</span><button id="resetSettings" class="resetSettings" type="button">デフォルトに戻す</button><button id="doneSettings" class="doneSettings" type="button">完了</button></div><div class="opacityFloat" id="opacityFloat"><div class="title"><span id="selectedName">未選択</span><span id="opacityValue">100%</span></div><input id="opacitySlider" type="range" min="20" max="100" step="5" value="100"></div><div class="settingsMenuOverlay" id="settingsMenuOverlay"><div class="settingsMenu" role="dialog" aria-modal="true" aria-labelledby="settingsMenuTitle"><div class="settingsMenuHeader"><h2 id="settingsMenuTitle">設定</h2><button id="settingsMenuClose" class="settingsMenuClose" type="button" aria-label="設定を閉じる">×</button></div><div class="settingsMenuList"><button id="controllerSettingsItem" class="settingsMenuItem" type="button">コントローラー設定<small>ボタン配置・サイズ・透明度を変更</small></button></div></div></div></section></main><div class="portraitNotice">端末を横向きにしてください</div>
<script>
(()=>{
const battleArea=document.getElementById('battleArea'),scene=document.getElementById('scene'),player=document.getElementById('player'),joystick=document.getElementById('joystick'),knob=document.getElementById('joystickKnob'),buttonA=document.getElementById('buttonA'),buttonB=document.getElementById('buttonB'),buttonX=document.getElementById('buttonX'),buttonY=document.getElementById('buttonY');
const settingsButton=document.getElementById('settingsButton'),settingsMenuOverlay=document.getElementById('settingsMenuOverlay'),settingsMenuClose=document.getElementById('settingsMenuClose'),controllerSettingsItem=document.getElementById('controllerSettingsItem'),editTopBar=document.getElementById('editTopBar'),editShade=document.getElementById('editShade'),selectedName=document.getElementById('selectedName'),opacitySlider=document.getElementById('opacitySlider'),opacityValue=document.getElementById('opacityValue'),resetSettings=document.getElementById('resetSettings'),doneSettings=document.getElementById('doneSettings'),selectionLabel=document.getElementById('selectionLabel'),opacityFloat=document.getElementById('opacityFloat');
const WORLD_SIZE=3600,PROJ_X=.72,PROJ_Y=.36,SCENE_WIDTH=WORLD_SIZE*PROJ_X*2,SCENE_HEIGHT=WORLD_SIZE*PROJ_Y*2,SPEED=260,DEAD_ZONE=.12,CAMERA_FOLLOW=.14,DASH_DISTANCE=360,DASH_DURATION=.13,DASH_COOLDOWN=.65;
const defaults={left:{x:18,y:16,scale:1,opacity:1},A:{right:82,bottom:16,scale:1,opacity:1},B:{right:8,bottom:88,scale:1,opacity:1},X:{right:156,bottom:88,scale:1,opacity:1},Y:{right:82,bottom:160,scale:1,opacity:1}};
let controlSettings=loadSettings(),editMode=false,menuOpen=false,selectedKey=null,editPointers=new Map(),gesture=null;
const elements={left:joystick,A:buttonA,B:buttonB,X:buttonX,Y:buttonY},names={left:'左スティック',A:'Aボタン',B:'Bボタン',X:'Xボタン',Y:'Yボタン'};
const state={x:WORLD_SIZE*.5,y:WORLD_SIZE*.5,inputX:0,inputY:0,lastDirX:1,lastDirY:0,pointerId:null,cameraX:0,cameraY:0,lastTime:performance.now(),dashRemaining:0,dashCooldown:0,dashVelX:0,dashVelY:0};
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v)),lerp=(a,b,t)=>a+(b-a)*t;
function cloneDefaults(){return JSON.parse(JSON.stringify(defaults))}
function loadSettings(){try{const s=JSON.parse(localStorage.getItem('battleNetworkControlsV3'));return s&&s.left&&s.A&&s.B&&s.X&&s.Y?s:cloneDefaults()}catch{return cloneDefaults()}}
function saveSettings(){localStorage.setItem('battleNetworkControlsV3',JSON.stringify(controlSettings))}
function applyControls(){const l=controlSettings.left;joystick.style.left=l.x+'px';joystick.style.bottom=l.y+'px';joystick.style.transform=`scale(${l.scale})`;joystick.style.opacity=l.opacity;['A','B','X','Y'].forEach(k=>{const el=elements[k],s=controlSettings[k];el.style.right=s.right+'px';el.style.bottom=s.bottom+'px';el.style.transform=`scale(${s.scale})`;el.style.opacity=s.opacity});updateSelectionLabel()}
function project(x,y){return{x:(x-y)*PROJ_X+SCENE_WIDTH/2,y:(x+y)*PROJ_Y}}
function screenInputToWorld(sx,sy){let wx=(sx/PROJ_X+sy/PROJ_Y)/2,wy=(sy/PROJ_Y-sx/PROJ_X)/2;const l=Math.hypot(wx,wy);if(l){wx/=l;wy/=l}return{x:wx,y:wy}}
function getCameraTarget(){const v=battleArea.getBoundingClientRect(),p=project(state.x,state.y);return{x:clamp(p.x-v.width/2,0,Math.max(0,SCENE_WIDTH-v.width)),y:clamp(p.y-v.height*.58,0,Math.max(0,SCENE_HEIGHT-v.height))}}
function render(){const p=project(state.x,state.y);player.style.transform=`translate3d(${p.x-player.offsetWidth/2}px,${p.y-player.offsetHeight}px,0)`;scene.style.transform=`translate3d(${-state.cameraX}px,${-state.cameraY}px,0)`;buttonX.classList.toggle('cooldown',state.dashCooldown>0)}
function initCamera(){const t=getCameraTarget();state.cameraX=t.x;state.cameraY=t.y;render()}
function setJoy(e){if(editMode||menuOpen)return;const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.335,d=Math.hypot(dx,dy),s=d>max?max/d:1,lx=dx*s,ly=dy*s,m=Math.hypot(lx/max,ly/max);if(m<DEAD_ZONE){state.inputX=state.inputY=0}else{const w=screenInputToWorld(lx/max,ly/max);state.inputX=w.x*m;state.inputY=w.y*m;state.lastDirX=w.x;state.lastDirY=w.y}knob.style.transform=`translate(calc(-50% + ${lx}px),calc(-50% + ${ly}px))`}
function resetJoy(){state.inputX=state.inputY=0;state.pointerId=null;knob.style.transform='translate(-50%,-50%)'}
joystick.addEventListener('pointerdown',e=>{if(editMode||menuOpen||state.pointerId!==null)return;state.pointerId=e.pointerId;joystick.setPointerCapture(e.pointerId);setJoy(e)});joystick.addEventListener('pointermove',e=>{if(!editMode&&!menuOpen&&e.pointerId===state.pointerId)setJoy(e)});joystick.addEventListener('pointerup',e=>{if(e.pointerId===state.pointerId)resetJoy()});joystick.addEventListener('pointercancel',resetJoy);joystick.addEventListener('lostpointercapture',resetJoy);
function dash(){if(editMode||menuOpen||state.dashCooldown>0||state.dashRemaining>0)return;let dx=state.inputX,dy=state.inputY,l=Math.hypot(dx,dy);if(l<DEAD_ZONE){dx=state.lastDirX;dy=state.lastDirY;l=Math.hypot(dx,dy)}if(!l)return;dx/=l;dy/=l;const speed=DASH_DISTANCE/DASH_DURATION;state.dashVelX=dx*speed;state.dashVelY=dy*speed;state.dashRemaining=DASH_DURATION;state.dashCooldown=DASH_COOLDOWN;player.classList.add('dashing');setTimeout(()=>player.classList.remove('dashing'),DASH_DURATION*1000)}
buttonX.addEventListener('pointerdown',e=>{if(editMode||menuOpen)return;e.preventDefault();dash()});[buttonA,buttonB,buttonY].forEach(btn=>{btn.addEventListener('pointerdown',()=>{if(!editMode&&!menuOpen)btn.classList.add('pressed')});['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,()=>btn.classList.remove('pressed'))) });
function selectTarget(key){if(selectedKey)elements[selectedKey].classList.remove('editTarget');selectedKey=key;elements[key].classList.add('editTarget');selectedName.textContent=names[key];opacitySlider.value=Math.round(controlSettings[key].opacity*100);opacityValue.textContent=opacitySlider.value+'%';opacityFloat.classList.add('show');updateSelectionLabel()}
function updateSelectionLabel(){if(!editMode||!selectedKey){selectionLabel.classList.remove('show');return}const r=elements[selectedKey].getBoundingClientRect(),b=battleArea.getBoundingClientRect();selectionLabel.textContent=names[selectedKey];selectionLabel.style.left=clamp(r.left-b.left,4,b.width-90)+'px';selectionLabel.style.top=clamp(r.top-b.top-28,4,b.height-24)+'px';selectionLabel.classList.add('show')}
function openSettingsMenu(){if(editMode)return;menuOpen=true;resetJoy();settingsMenuOverlay.classList.add('open')}
function closeSettingsMenu(){menuOpen=false;settingsMenuOverlay.classList.remove('open')}
function startEdit(){closeSettingsMenu();editMode=true;battleArea.classList.add('editMode');editShade.hidden=false;editTopBar.classList.add('open');selectTarget(selectedKey||'left');resetJoy()}
function endEdit(){editMode=false;battleArea.classList.remove('editMode');editShade.hidden=true;editTopBar.classList.remove('open');opacityFloat.classList.remove('show');selectionLabel.classList.remove('show');if(selectedKey)elements[selectedKey].classList.remove('editTarget');editPointers.clear();gesture=null;globalPinchPointers.clear();globalPinch=null;saveSettings();openSettingsMenu()}
settingsButton.addEventListener('click',openSettingsMenu);settingsMenuClose.addEventListener('click',closeSettingsMenu);settingsMenuOverlay.addEventListener('pointerdown',e=>{if(e.target===settingsMenuOverlay)closeSettingsMenu()});controllerSettingsItem.addEventListener('click',startEdit);doneSettings.addEventListener('click',endEdit);resetSettings.addEventListener('click',()=>{controlSettings=cloneDefaults();applyControls();if(selectedKey)selectTarget(selectedKey);saveSettings()});opacitySlider.addEventListener('input',()=>{if(!selectedKey)return;controlSettings[selectedKey].opacity=Number(opacitySlider.value)/100;opacityValue.textContent=opacitySlider.value+'%';applyControls();saveSettings()});
function pointerDistance(){const arr=[...editPointers.values()];if(arr.length<2)return 0;return Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y)}
Object.entries(elements).forEach(([key,el])=>{el.addEventListener('pointerdown',e=>{if(!editMode)return;e.preventDefault();e.stopPropagation();selectTarget(key);el.setPointerCapture?.(e.pointerId);editPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(editPointers.size===1){const s=controlSettings[key];gesture={mode:'drag',startX:e.clientX,startY:e.clientY,baseX:key==='left'?s.x:s.right,baseY:key==='left'?s.y:s.bottom,baseScale:s.scale,key}}else if(editPointers.size===2){gesture={mode:'pinch',startDist:pointerDistance(),baseScale:controlSettings[key].scale,key}}});el.addEventListener('pointermove',e=>{if(!editMode||!editPointers.has(e.pointerId)||!gesture)return;editPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const s=controlSettings[gesture.key];if(gesture.mode==='drag'&&editPointers.size===1){const dx=e.clientX-gesture.startX,dy=e.clientY-gesture.startY;if(gesture.key==='left'){s.x=clamp(gesture.baseX+dx,-40,battleArea.clientWidth-60);s.y=clamp(gesture.baseY-dy,-40,battleArea.clientHeight-60)}else{s.right=clamp(gesture.baseX-dx,-40,battleArea.clientWidth-60);s.bottom=clamp(gesture.baseY-dy,-40,battleArea.clientHeight-60)}applyControls()}else if(editPointers.size>=2){const d=pointerDistance();if(!gesture.startDist)gesture.startDist=d;s.scale=clamp(gesture.baseScale*(d/gesture.startDist),.55,1.6);applyControls()}});const end=e=>{if(!editMode)return;editPointers.delete(e.pointerId);gesture=null;saveSettings()};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('lostpointercapture',end)});
const globalPinchPointers=new Map();let globalPinch=null;
function globalPinchDistance(){const p=[...globalPinchPointers.values()];return p.length<2?0:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}
function isEditUiTarget(target){return !!target.closest('.editTopBar,.opacityFloat')}
battleArea.addEventListener('pointerdown',e=>{if(!editMode||!selectedKey||isEditUiTarget(e.target)||e.target.closest('.joystick,.actionButton'))return;globalPinchPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});battleArea.setPointerCapture?.(e.pointerId);if(globalPinchPointers.size===2){globalPinch={startDist:globalPinchDistance(),baseScale:controlSettings[selectedKey].scale,key:selectedKey}}});
battleArea.addEventListener('pointermove',e=>{if(!editMode||!globalPinchPointers.has(e.pointerId))return;globalPinchPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(globalPinchPointers.size>=2&&globalPinch){const d=globalPinchDistance();if(globalPinch.startDist>0){controlSettings[globalPinch.key].scale=clamp(globalPinch.baseScale*(d/globalPinch.startDist),.55,1.6);applyControls()}}});
function endGlobalPinch(e){if(!globalPinchPointers.has(e.pointerId))return;globalPinchPointers.delete(e.pointerId);if(globalPinchPointers.size<2){globalPinch=null;saveSettings()}}
battleArea.addEventListener('pointerup',endGlobalPinch);battleArea.addEventListener('pointercancel',endGlobalPinch);battleArea.addEventListener('lostpointercapture',endGlobalPinch);
function update(time){const dt=Math.min((time-state.lastTime)/1000,.05);state.lastTime=time;if(state.dashCooldown>0)state.dashCooldown=Math.max(0,state.dashCooldown-dt);if(!editMode&&!menuOpen){if(state.dashRemaining>0){const step=Math.min(dt,state.dashRemaining);state.x+=state.dashVelX*step;state.y+=state.dashVelY*step;state.dashRemaining=Math.max(0,state.dashRemaining-step)}else{state.x+=state.inputX*SPEED*dt;state.y+=state.inputY*SPEED*dt}}state.x=clamp(state.x,0,WORLD_SIZE);state.y=clamp(state.y,0,WORLD_SIZE);const t=getCameraTarget(),f=1-Math.pow(1-CAMERA_FOLLOW,dt*60);state.cameraX=lerp(state.cameraX,t.x,f);state.cameraY=lerp(state.cameraY,t.y,f);render();requestAnimationFrame(update)}
window.addEventListener('resize',()=>{initCamera();updateSelectionLabel()});applyControls();render();initCamera();requestAnimationFrame(update);
})();
</script>
<script>
(()=>{if(!('serviceWorker'in navigator))return;let registrationRef=null;async function checkForUpdate(){if(!navigator.onLine)return;try{const registration=registrationRef||await navigator.serviceWorker.getRegistration('./');if(registration){registrationRef=registration;await registration.update()}}catch(error){console.warn('Service Worker update check failed:',error)}}window.addEventListener('load',async()=>{try{registrationRef=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});await checkForUpdate()}catch(error){console.warn('Service Worker registration failed:',error)}});window.addEventListener('pageshow',checkForUpdate);window.addEventListener('online',checkForUpdate);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkForUpdate()})})();
</script>
</body>
</html>
