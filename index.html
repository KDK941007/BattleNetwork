<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>BattleNetwork Movement Prototype</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111b}body{padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}.gameShell{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr;gap:6px}.statusBar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px;padding:5px 10px;border:1px solid rgba(90,214,255,.35);border-radius:8px;background:rgba(3,17,28,.92);color:#dff7ff;font-size:13px;font-weight:700;letter-spacing:.04em}.statusRight{display:flex;align-items:center;gap:8px}.statusHint{color:#7bcce7;font-size:11px;font-weight:600}.settingsButton{width:32px;height:32px;border-radius:8px;border:1px solid rgba(127,224,255,.5);background:#0c2634;color:#e8fbff;font-size:18px}.battleArea{position:relative;width:100%;min-height:0;overflow:hidden;border:2px solid rgba(84,221,255,.45);border-radius:12px;background:linear-gradient(180deg,#0b1a24,#061018);box-shadow:0 0 28px rgba(30,188,255,.14) inset}.scene{position:absolute;left:0;top:0;width:5184px;height:2592px;will-change:transform}.floor{position:absolute;inset:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:repeating-linear-gradient(26.565deg,rgba(83,194,222,.14) 0 2px,transparent 2px 72px),repeating-linear-gradient(153.435deg,rgba(83,194,222,.12) 0 2px,transparent 2px 72px),linear-gradient(180deg,rgba(58,130,151,.28),rgba(17,63,79,.32) 48%,rgba(7,27,38,.6)),#0b2531}.floorBorder{position:absolute;inset:0;pointer-events:none;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%,50% 0,50.18% .35%,.36% 50%,50% 99.65%,99.64% 50%,50% .35%);background:rgba(104,225,249,.34)}.centerMark{position:absolute;left:50%;top:50%;width:160px;height:80px;transform:translate(-50%,-50%);border:2px solid rgba(116,225,246,.24);background:rgba(70,178,203,.04);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.player{position:absolute;left:0;top:0;width:clamp(34px,5.2vw,46px);height:clamp(42px,6.3vw,58px);border-radius:16px 16px 11px 11px;background:linear-gradient(90deg,transparent 0 20%,rgba(255,255,255,.4) 20% 32%,transparent 32%),linear-gradient(180deg,#51d7ff,#1d8df2 44%,#163f8b);border:2px solid rgba(193,247,255,.85);box-shadow:0 0 12px rgba(64,203,255,.85),0 7px 0 rgba(0,0,0,.2);transform-origin:50% 100%;will-change:transform;z-index:3}.player.dashing{filter:brightness(1.45);box-shadow:0 0 22px rgba(112,235,255,.95),0 7px 0 rgba(0,0,0,.2)}.player:before{content:"";position:absolute;left:22%;right:22%;top:15%;height:23%;border-radius:8px;background:#081d4e}.player:after{content:"";position:absolute;left:50%;bottom:-10px;width:96%;height:13px;border-radius:50%;background:rgba(0,0,0,.38);transform:translateX(-50%) skewX(-18deg);filter:blur(2px);z-index:-1}.joystick{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:clamp(112px,16vw,150px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(73,210,255,.14) 0 48%,transparent 49%),rgba(8,31,42,.72);border:2px solid rgba(76,202,245,.42);z-index:10;transform-origin:center}.joystick:before,.joystick:after{content:"";position:absolute;background:rgba(91,217,255,.16)}.joystick:before{width:2px;top:12%;bottom:12%;left:50%}.joystick:after{height:2px;left:12%;right:12%;top:50%}.joystickKnob{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9aedff,#3299d8 50%,#155278);border:2px solid rgba(221,251,255,.9);transform:translate(-50%,-50%);pointer-events:none}.actionPad{position:absolute;right:8px;bottom:max(16px,env(safe-area-inset-bottom));width:clamp(170px,23vw,220px);aspect-ratio:1;z-index:11;transform-origin:center}.actionButton{position:absolute;width:clamp(54px,7.5vw,68px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(210,248,255,.82);background:radial-gradient(circle at 35% 30%,rgba(135,231,255,.3),rgba(29,94,128,.9) 58%,rgba(8,34,52,.96));color:#eefcff;font-size:clamp(18px,2.6vw,24px);font-weight:900}.actionButton.y{left:50%;top:0;transform:translateX(-50%)}.actionButton.x{left:0;top:50%;transform:translateY(-50%)}.actionButton.b{right:0;top:50%;transform:translateY(-50%)}.actionButton.a{left:50%;bottom:0;transform:translateX(-50%)}.actionButton.y:active,.actionButton.y.pressed,.actionButton.a:active,.actionButton.a.pressed{transform:translateX(-50%) scale(.92)}.actionButton.x:active,.actionButton.x.pressed,.actionButton.b:active,.actionButton.b.pressed{transform:translateY(-50%) scale(.92)}.actionButton.cooldown{opacity:.42}.settingsOverlay{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(2,10,16,.78)}.settingsOverlay.open{display:flex}.settingsPanel{width:min(720px,96%);max-height:92%;overflow:auto;border:1px solid rgba(112,220,255,.45);border-radius:14px;background:#0a1e2a;color:#e9faff;padding:14px}.settingsHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.settingsHeader h2{font-size:18px;margin:0}.closeSettings{width:36px;height:36px;border-radius:8px;border:1px solid rgba(150,230,255,.5);background:#102f40;color:#fff;font-size:20px}.settingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.settingsGroup{border:1px solid rgba(96,195,225,.25);border-radius:10px;padding:10px}.settingsGroup h3{margin:0 0 8px;font-size:14px}.settingRow{display:grid;grid-template-columns:72px 1fr 50px;align-items:center;gap:8px;margin:8px 0;font-size:12px}.settingRow input{width:100%;touch-action:auto}.settingValue{text-align:right;color:#8dddf4;font-variant-numeric:tabular-nums}.settingsActions{display:flex;justify-content:flex-end;margin-top:12px}.resetSettings{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid rgba(255,190,120,.5);background:#3b2818;color:#ffe5c6;font-weight:700}.portraitNotice{display:none}@media(max-width:700px){.settingsGrid{grid-template-columns:1fr}}@media(orientation:portrait){.portraitNotice{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#07111b;color:#dff7ff;font-size:18px;font-weight:700}}
</style></head><body><main class="gameShell"><header class="statusBar"><span>ACTION TEST</span><div class="statusRight"><span class="statusHint">左：移動 / 右：A B X Y</span><button id="settingsButton" class="settingsButton" type="button" aria-label="コントローラー設定">⚙</button></div></header><section class="battleArea" id="battleArea"><div class="scene" id="scene"><div class="floor"></div><div class="floorBorder"></div><div class="centerMark"></div><div class="player" id="player"></div></div><div class="joystick" id="joystick"><div class="joystickKnob" id="joystickKnob"></div></div><div class="actionPad" id="actionPad"><button class="actionButton y" id="buttonY" type="button">Y</button><button class="actionButton x" id="buttonX" type="button">X</button><button class="actionButton b" id="buttonB" type="button">B</button><button class="actionButton a" id="buttonA" type="button">A</button></div><div class="settingsOverlay" id="settingsOverlay"><div class="settingsPanel"><div class="settingsHeader"><h2>コントローラー設定</h2><button class="closeSettings" id="closeSettings" type="button">×</button></div><div class="settingsGrid"><section class="settingsGroup"><h3>左スティック</h3><div class="settingRow"><span>サイズ</span><input id="leftScale" type="range" min="70" max="140" step="5"><span id="leftScaleValue" class="settingValue"></span></div><div class="settingRow"><span>左右</span><input id="leftX" type="range" min="-80" max="120" step="5"><span id="leftXValue" class="settingValue"></span></div><div class="settingRow"><span>上下</span><input id="leftY" type="range" min="-120" max="80" step="5"><span id="leftYValue" class="settingValue"></span></div><div class="settingRow"><span>透明度</span><input id="leftOpacity" type="range" min="30" max="100" step="5"><span id="leftOpacityValue" class="settingValue"></span></div></section><section class="settingsGroup"><h3>右ボタン</h3><div class="settingRow"><span>サイズ</span><input id="rightScale" type="range" min="70" max="140" step="5"><span id="rightScaleValue" class="settingValue"></span></div><div class="settingRow"><span>左右</span><input id="rightX" type="range" min="-120" max="80" step="5"><span id="rightXValue" class="settingValue"></span></div><div class="settingRow"><span>上下</span><input id="rightY" type="range" min="-120" max="80" step="5"><span id="rightYValue" class="settingValue"></span></div><div class="settingRow"><span>透明度</span><input id="rightOpacity" type="range" min="30" max="100" step="5"><span id="rightOpacityValue" class="settingValue"></span></div></section></div><div class="settingsActions"><button id="resetSettings" class="resetSettings" type="button">デフォルトに戻す</button></div></div></div></section></main><div class="portraitNotice">端末を横向きにしてください</div><script>
(()=>{const battleArea=document.getElementById('battleArea'),scene=document.getElementById('scene'),player=document.getElementById('player'),joystick=document.getElementById('joystick'),knob=document.getElementById('joystickKnob'),actionPad=document.getElementById('actionPad'),buttonX=document.getElementById('buttonX');const WORLD_SIZE=3600,PROJ_X=.72,PROJ_Y=.36,SCENE_WIDTH=WORLD_SIZE*PROJ_X*2,SCENE_HEIGHT=WORLD_SIZE*PROJ_Y*2,SPEED=260,DEAD_ZONE=.12,CAMERA_FOLLOW=.14,DASH_DISTANCE=360,DASH_DURATION=.13,DASH_COOLDOWN=.65;const state={x:WORLD_SIZE*.5,y:WORLD_SIZE*.5,inputX:0,inputY:0,lastDirX:1,lastDirY:0,pointerId:null,cameraX:0,cameraY:0,lastTime:performance.now(),dashRemaining:0,dashCooldown:0,dashVelX:0,dashVelY:0};const clamp=(v,min,max)=>Math.max(min,Math.min(max,v)),lerp=(a,b,t)=>a+(b-a)*t;function project(x,y){return{x:(x-y)*PROJ_X+SCENE_WIDTH/2,y:(x+y)*PROJ_Y}}function screenInputToWorld(sx,sy){let wx=(sx/PROJ_X+sy/PROJ_Y)/2,wy=(sy/PROJ_Y-sx/PROJ_X)/2;const l=Math.hypot(wx,wy);if(l){wx/=l;wy/=l}return{x:wx,y:wy}}function getCameraTarget(){const v=battleArea.getBoundingClientRect(),p=project(state.x,state.y);return{x:clamp(p.x-v.width/2,0,Math.max(0,SCENE_WIDTH-v.width)),y:clamp(p.y-v.height*.58,0,Math.max(0,SCENE_HEIGHT-v.height))}}function render(){const p=project(state.x,state.y);player.style.transform=`translate3d(${p.x-player.offsetWidth/2}px,${p.y-player.offsetHeight}px,0)`;scene.style.transform=`translate3d(${-state.cameraX}px,${-state.cameraY}px,0)`;buttonX.classList.toggle('cooldown',state.dashCooldown>0)}function initCamera(){const t=getCameraTarget();state.cameraX=t.x;state.cameraY=t.y;render()}function setJoy(e){const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.335,d=Math.hypot(dx,dy),s=d>max?max/d:1,lx=dx*s,ly=dy*s,m=Math.hypot(lx/max,ly/max);if(m<DEAD_ZONE){state.inputX=state.inputY=0}else{const w=screenInputToWorld(lx/max,ly/max);state.inputX=w.x*m;state.inputY=w.y*m;state.lastDirX=w.x;state.lastDirY=w.y}knob.style.transform=`translate(calc(-50% + ${lx}px),calc(-50% + ${ly}px))`}function resetJoy(){state.inputX=state.inputY=0;state.pointerId=null;knob.style.transform='translate(-50%,-50%)'}joystick.addEventListener('pointerdown',e=>{if(state.pointerId!==null)return;state.pointerId=e.pointerId;joystick.setPointerCapture(e.pointerId);setJoy(e)});joystick.addEventListener('pointermove',e=>{if(e.pointerId===state.pointerId)setJoy(e)});joystick.addEventListener('pointerup',e=>{if(e.pointerId===state.pointerId)resetJoy()});joystick.addEventListener('pointercancel',resetJoy);joystick.addEventListener('lostpointercapture',resetJoy);function dash(){if(state.dashCooldown>0||state.dashRemaining>0)return;let dx=state.inputX,dy=state.inputY,l=Math.hypot(dx,dy);if(l<DEAD_ZONE){dx=state.lastDirX;dy=state.lastDirY;l=Math.hypot(dx,dy)}if(!l)return;dx/=l;dy/=l;const sp=DASH_DISTANCE/DASH_DURATION;state.dashVelX=dx*sp;state.dashVelY=dy*sp;state.dashRemaining=DASH_DURATION;state.dashCooldown=DASH_COOLDOWN;player.classList.add('dashing');setTimeout(()=>player.classList.remove('dashing'),DASH_DURATION*1000)}buttonX.addEventListener('pointerdown',e=>{e.preventDefault();dash()});['buttonA','buttonB','buttonY'].forEach(id=>{const b=document.getElementById(id),off=()=>b.classList.remove('pressed');b.addEventListener('pointerdown',()=>b.classList.add('pressed'));b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});function update(t){const dt=Math.min((t-state.lastTime)/1000,.05);state.lastTime=t;if(state.dashCooldown>0)state.dashCooldown=Math.max(0,state.dashCooldown-dt);if(state.dashRemaining>0){const s=Math.min(dt,state.dashRemaining);state.x+=state.dashVelX*s;state.y+=state.dashVelY*s;state.dashRemaining-=s}else{state.x+=state.inputX*SPEED*dt;state.y+=state.inputY*SPEED*dt}state.x=clamp(state.x,0,WORLD_SIZE);state.y=clamp(state.y,0,WORLD_SIZE);const tg=getCameraTarget(),f=1-Math.pow(1-CAMERA_FOLLOW,dt*60);state.cameraX=lerp(state.cameraX,tg.x,f);state.cameraY=lerp(state.cameraY,tg.y,f);render();requestAnimationFrame(update)}window.addEventListener('resize',initCamera);initCamera();requestAnimationFrame(update);
const defaults={leftScale:100,leftX:0,leftY:0,leftOpacity:100,rightScale:100,rightX:0,rightY:0,rightOpacity:100},key='battleNetworkControllerSettings';let cfg={...defaults};try{const saved=JSON.parse(localStorage.getItem(key)||'{}');cfg={...defaults,...saved}}catch{}const ids=Object.keys(defaults);function apply(){joystick.style.transform=`translate(${cfg.leftX}px,${cfg.leftY}px) scale(${cfg.leftScale/100})`;joystick.style.opacity=cfg.leftOpacity/100;actionPad.style.transform=`translate(${cfg.rightX}px,${cfg.rightY}px) scale(${cfg.rightScale/100})`;actionPad.style.opacity=cfg.rightOpacity/100}function sync(){ids.forEach(id=>{const el=document.getElementById(id),out=document.getElementById(id+'Value');el.value=cfg[id];out.textContent=(id.includes('Scale')||id.includes('Opacity'))?cfg[id]+'%':(cfg[id]>0?'+':'')+cfg[id]+'px'})}function save(){localStorage.setItem(key,JSON.stringify(cfg))}ids.forEach(id=>document.getElementById(id).addEventListener('input',e=>{cfg[id]=Number(e.target.value);sync();apply();save()}));document.getElementById('resetSettings').addEventListener('click',()=>{cfg={...defaults};save();sync();apply()});const overlay=document.getElementById('settingsOverlay');document.getElementById('settingsButton').addEventListener('click',()=>overlay.classList.add('open'));document.getElementById('closeSettings').addEventListener('click',()=>overlay.classList.remove('open'));sync();apply()})();
</script><script>(()=>{if(!('serviceWorker'in navigator))return;let r=null;async function u(){if(!navigator.onLine)return;try{const x=r||await navigator.serviceWorker.getRegistration('./');if(x){r=x;await x.update()}}catch(e){console.warn('Service Worker update check failed:',e)}}window.addEventListener('load',async()=>{try{r=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});await u()}catch(e){console.warn('Service Worker registration failed:',e)}});window.addEventListener('pageshow',u);window.addEventListener('online',u);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')u()})})();</script></body></html>
