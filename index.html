<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
.customGauge .customFill{display:block}
.customGauge::after{content:"";position:absolute;left:-12px;right:-12px;top:-10px;bottom:-28px}
.player{width:108px;height:136px;border-radius:38px 38px 26px 26px}
.bullet.normal{width:30px;height:15px;box-shadow:0 0 12px #50d9ff}
.bullet.charged{width:52px;height:26px;box-shadow:0 0 16px #ff514e}
.bullet.cannon{width:132px;height:66px;box-shadow:0 0 24px #ffd55a}
.editTopBar{top:4px;width:min(560px,68vw);min-height:44px;justify-content:space-between;gap:10px;padding:6px 10px}
.editTopBar .label{flex:0 0 auto}
#cameraZoomControl{display:grid;grid-template-columns:auto minmax(120px,1fr) 44px;align-items:center;gap:8px;flex:1;min-width:0;font-size:11px;font-weight:900;white-space:nowrap}
#cameraZoomSlider{width:100%;min-width:0;touch-action:auto}
#cameraZoomValue{min-width:44px;text-align:right}
.editTopBar .resetSettings,.editTopBar .doneSettings{flex:0 0 auto;white-space:nowrap}
.act.directionLocked{background:linear-gradient(180deg,#8a6514,#59400c);border-color:#ffe27a;color:#fff7c9;box-shadow:0 0 16px rgba(255,219,92,.72),inset 0 0 0 2px rgba(255,246,191,.22);filter:brightness(1.18)}
</style>
</head>
<body>
<main class="shell">
  <footer class="footer">
    <div class="chipHud"><span class="chipNow" id="chipNow">チップ</span><div class="queue" id="queue"></div></div>
    <button class="gear" id="gear" type="button" aria-label="設定"><svg class="cyberGear" viewBox="0 0 32 32" aria-hidden="true"><path class="outer" d="M13 2h6l1.2 4.1 3.1 1.3 3.8-2.1 4.2 4.2-2.1 3.8 1.3 3.1L34 17v6l-3.5.6-1.3 3.1 2.1 3.8-4.2 4.2-3.8-2.1-3.1 1.3L19 38h-6l-1.2-4.1-3.1-1.3-3.8 2.1-4.2-4.2 2.1-3.8-1.3-3.1L-2 23v-6l3.5-.6 1.3-3.1-2.1-3.8 4.2-4.2 3.8 2.1 3.1-1.3z" transform="scale(.78) translate(4.7 1.7)"/><path class="inner" d="M16 10l5 3v6l-5 3-5-3v-6z"/><path class="circuit" d="M16 5v5M27 16h-6M16 27v-5M5 16h6"/><circle class="node" cx="16" cy="5" r="1.3"/><circle class="node" cx="27" cy="16" r="1.3"/><circle class="node" cx="16" cy="27" r="1.3"/><circle class="node" cx="5" cy="16" r="1.3"/></svg></button>
  </footer>
  <button class="customGauge" id="customGauge" type="button" aria-label="CUSTOM" style="padding:0;-webkit-appearance:none;appearance:none"><span class="customFill" id="customFill"></span><span class="customLabel" id="customLabel"></span></button>
  <section class="battle" id="battle">
    <div class="defeatNotice" id="defeatNotice" hidden aria-live="polite">DELETED</div>
    <div class="playerStatusHud" id="playerStatusHud" aria-label="プレイヤーステータス"><div class="playerHpWindow unconfigured" id="playerHpWindow"><span class="playerHpValue" id="playerHpValue">---</span></div><div class="kokoroWindow" id="kokoroWindow" data-state="NORMAL" aria-label="ココロウィンドウ"><div class="kokoroPortrait" aria-hidden="true"></div><div class="kokoroStateMark" aria-hidden="true"></div></div></div>
    <div class="scene" id="scene"><div class="floor"></div><div class="rangePreview cannonPreview" id="cannonPreview"></div><div class="rangePreview meleePreview" id="meleePreview"></div><div class="rangePreview bombPath" id="bombPath"></div><div class="bombTarget" id="bombTarget"></div><div class="player" id="player"></div><div class="arrow" id="arrow"></div></div>
    <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
    <button class="act" id="Y">Y</button><button class="act" id="X">X</button><button class="act" id="B">B</button><button class="act" id="A">A</button>
    <div class="editShade" id="editShade" hidden></div><div class="selectionLabel" id="selectionLabel"></div>
    <div class="editTopBar" id="editTopBar"><span class="label">配置編集</span><button id="resetSettings" class="resetSettings" type="button">デフォルトに戻す</button><button id="doneSettings" class="doneSettings" type="button">完了</button></div>
    <div class="opacityFloat" id="opacityFloat"><div class="title"><span id="selectedName">未選択</span><span id="opacityValue">100%</span></div><input id="opacitySlider" type="range" min="20" max="100" step="5" value="100"></div>
    <div class="modal" id="customModal"><div class="customPanel"><div class="customHead"><h2>CUSTOM</h2><span id="folderInfo"></span></div><div class="handViewport"><div class="hand" id="hand"></div></div><div class="instruction">タップで選択／再タップでキャンセル。長押しでチップ詳細を表示。</div><div class="customActions"><button class="sendBtn" id="send">決定</button><button class="soulBtn" disabled>ソウルユニゾン</button></div></div></div>
    <div class="modal chipDetailModal" id="chipDetailModal"><div class="chipDetail"><div class="chipDetailHead modalHead"><div class="chipTitleFrame" aria-label="チップ基本情報"><span class="chipTitleNo" id="detailLibraryNo">No.----</span><span class="chipTitleClass" id="detailClass">--</span><span class="chipTitleName" id="detailChipName">チップ詳細</span><span class="chipTitleRarity" id="detailRarity">--</span></div><span id="detailName" hidden aria-hidden="true"></span><button class="modalClose" id="detailClose" type="button" aria-label="詳細を閉じる"></button></div><div class="chipDetailBody"><div class="detailVisual"><div class="detailArt" id="detailArt"></div></div><div class="detailText"><div class="detailRow"><div class="detailContentHead"><span class="detailLabel">チップの内容</span><span class="detailMbBadge">MB <span id="detailCapacity">--</span></span></div><span class="detailValue detailDescription" id="detailDesc"></span><div class="detailDataBlock"><span class="detailLabel">主要値</span><div class="detailTokenScroller" id="detailValues" aria-label="主要値"></div><span id="detailPower" hidden></span></div><div class="detailDataBlock"><span class="detailLabel">属性・系統</span><div class="detailTokenScroller" id="detailAttributes" aria-label="属性・系統"></div><span id="detailAttrIcon" hidden></span><span id="detailAttr" hidden></span></div></div></div></div><div class="rangeTitle">範囲</div><div class="rangeLayout"><div class="rangeViz" id="detailRange"><span class="rangePlayer" aria-hidden="true"></span><span class="vizLine"></span><span class="vizBox"></span><span class="vizArc"></span><span class="vizTarget"></span><span class="vizHeal"></span></div><div class="rangeInfo"><div class="rangeInfoTitle">範囲情報</div><div class="rangeSpecs"><div class="rangeSpec"><span class="rangeSpecLabel">種別</span><span class="rangeSpecValue rangeTypeValue"></span></div><div class="rangeSpec"><span class="rangeSpecLabel">方向</span><span class="rangeSpecValue rangeDirectionValue"></span></div><div class="rangeSpec"><span class="rangeSpecLabel">射程</span><span class="rangeSpecValue rangeDistanceValue"></span></div><div class="rangeSpec"><span class="rangeSpecLabel">範囲</span><span class="rangeSpecValue rangeShapeValue"></span></div></div><div class="detailRangeCaption"><span class="detailLabel">説明</span><span class="detailValue" id="detailRangeText"></span></div></div></div></div></div>
    <div class="modal" id="settingsModal"><div class="settings"><div class="settingsHead modalHead"><b>設定</b><button id="closeSettings" class="modalClose" type="button" aria-label="設定を閉じる"></button></div><div class="settingsList"><button id="controllerSettingsItem" class="settingsItem" type="button">コントローラー設定<small>配置・サイズ・透明度・カメラ倍率を変更</small></button></div></div></div>
  </section>
</main>
<div class="portrait">端末を横向きにしてください</div>

<script src="./js/field/field-grid.js?v=38"></script><script src="./js/field/field-grid-renderer.js?v=39"></script>
<script src="./js/combat/range-geometry.js?v=53"></script><script src="./js/combat/relative-cell-range.js?v=1"></script><script src="./js/combat/range-preview-renderer.js?v=51"></script><script src="./js/combat/bomb-preview-renderer.js?v=51"></script>
<script src="./js/combat/enemy-foundation.js?v=104"></script><script src="./js/combat/player-health.js?v=90"></script><script src="./js/ui/player-hud.js?v=82"></script>
<script src="./js/combat/projectile-shadow-renderer.js?v=78"></script><script src="./js/combat/buster-projectile-layer.js?v=79"></script><script src="./js/combat/b-attack-system.js?v=73"></script><script src="./js/combat/parameter-system.js?v=1"></script>
<script src="./js/game.js?v=105"></script><script src="./js/combat/player-damage-system.js?v=92"></script><script src="./js/combat/enemy-attack-layer.js?v=105"></script><script src="./js/combat/enemy-ai-system.js?v=105"></script><script src="./js/combat/enemy-behavior-straight-shot.js?v=104"></script><script src="./js/combat/enemy-behavior-target-area.js?v=105"></script><script src="./js/combat/enemy-behavior-oscillate-movement.js?v=104"></script>
<script src="./js/combat/wave-system.js?v=115"></script><script src="./js/ui/camera-zoom-settings.js?v=66"></script><script src="./js/combat/combat-hit-test.js?v=97"></script><script src="./js/combat/spread-gun-system.js?v=1"></script><script src="./js/ui/test-chip-ui.js?v=70"></script><script src="./js/service-worker-register.js"></script>
</body>
</html>
