button{font:inherit;color:inherit}.shell{height:100%;display:grid;grid-template-rows:auto 1fr;gap:6px}.top{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 8px;border:1px solid #24566b;border-radius:9px;background:#061923}.chipHud{min-width:0;display:flex;align-items:center;gap:7px;flex:1}.chipNow{font-weight:900;white-space:nowrap}.queue{display:flex;gap:4px;min-width:0;overflow:hidden}.q{padding:3px 6px;border:1px solid #39758d;border-radius:5px;background:#0b2a38;font-size:10px;white-space:nowrap}.customGauge{width:min(190px,27vw);height:18px;position:relative;border:1px solid #4aa8c7;border-radius:9px;overflow:hidden;background:#07121a}.customFill{height:100%;width:0;background:linear-gradient(90deg,#20a8d6,#9cf2ff)}.customLabel{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:900;text-shadow:0 1px #000}.customBtn,.gear{height:32px;border:1px solid #65cce9;border-radius:8px;background:#0d3445;font-weight:900}.customBtn{display:none;padding:0 10px}.customBtn.ready{display:block;animation:pulse .55s infinite alternate}@keyframes pulse{to{filter:brightness(1.5)}}.gear{width:34px;font-size:18px}.battle{position:relative;min-height:0;overflow:hidden;border:2px solid #285d70;border-radius:12px;background:#07131b}.scene{position:absolute;left:0;top:0;width:5184px;height:2592px;will-change:transform;transform-origin:0 0}.floor{position:absolute;inset:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:repeating-linear-gradient(26.565deg,rgba(83,194,222,.14) 0 2px,transparent 2px 72px),repeating-linear-gradient(153.435deg,rgba(83,194,222,.12) 0 2px,transparent 2px 72px),linear-gradient(#173745,#0a202b)}
.player{position:absolute;width:44px;height:56px;border-radius:16px 16px 11px 11px;background:linear-gradient(#51d7ff,#1d8df2 44%,#163f8b);border:2px solid #c1f7ff;box-shadow:0 0 12px #40cbff;z-index:5}.player.dashing{filter:brightness(1.5)}.arrow{position:absolute;width:26px;height:4px;border-radius:3px;background:#d9fbff;transform-origin:2px 50%;z-index:7;box-shadow:0 0 8px #7eeeff}.arrow:after{content:"";position:absolute;right:-3px;top:-4px;border-left:8px solid #d9fbff;border-top:6px solid transparent;border-bottom:6px solid transparent}.arrow.charging:before,.arrow.ready:before{content:"";position:absolute;right:-12px;top:-7px;width:18px;height:18px;border-radius:50%;background:#45d9ff;box-shadow:0 0 15px #2bcfff}.arrow.ready:before{width:24px;height:24px;right:-15px;top:-10px;background:#ff514e;box-shadow:0 0 18px #ff3939}
.rangePreview{position:absolute;left:0;top:0;z-index:4;pointer-events:none;transform-origin:0 50%;display:none}.rangePreview.show{display:block}.cannonPreview{height:28px;border:3px solid rgba(255,229,96,.96);background:rgba(255,229,96,.24);border-radius:14px;box-shadow:0 0 12px rgba(255,229,96,.3)}.meleePreview{border:3px solid rgba(112,238,255,.98);background:rgba(112,238,255,.28);border-radius:9px;box-shadow:0 0 12px rgba(112,238,255,.28)}.bombPath{height:5px;border-top:3px dashed rgba(255,190,86,.95)}.bombTarget{position:absolute;z-index:4;display:none;border:3px dashed rgba(255,177,70,.98);border-radius:50%;background:rgba(255,150,50,.2);pointer-events:none}.bombTarget.show{display:block}
.bullet{position:absolute;z-index:6;pointer-events:none;border-radius:50%;transform-origin:center}.bullet.normal{width:18px;height:9px;background:#66ddff;box-shadow:0 0 8px #50d9ff}.bullet.charged{width:38px;height:19px;background:#ff514e;box-shadow:0 0 12px #ff514e}.bullet.cannon{width:28px;height:14px;background:#ffd55a;box-shadow:0 0 10px #ffd55a}.slash{position:absolute;z-index:8;border:4px solid rgba(134,244,255,.9);border-left:0;border-bottom:0;border-radius:50%;pointer-events:none;animation:slash .22s forwards}@keyframes slash{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(1.15)}}.boom{position:absolute;z-index:8;border-radius:50%;background:rgba(255,139,44,.55);border:4px solid #ffd25e;pointer-events:none;animation:boom .35s forwards}@keyframes boom{to{transform:scale(1.35);opacity:0}}.healPulse{position:absolute;z-index:8;border-radius:50%;pointer-events:none;border:4px solid rgba(112,255,158,.95);background:radial-gradient(circle,rgba(140,255,175,.32),rgba(83,255,143,.08) 55%,transparent 70%);box-shadow:0 0 18px rgba(88,255,145,.8);animation:healPulse .55s ease-out forwards}.healPulse:after{content:"";position:absolute;inset:18%;border-radius:50%;border:2px solid rgba(215,255,226,.9)}@keyframes healPulse{from{transform:scale(.45);opacity:1}to{transform:scale(1.35);opacity:0}}
.joy{position:absolute;left:18px;bottom:16px;width:140px;height:140px;border-radius:50%;background:rgba(15,56,72,.72);border:2px solid #337e99;z-index:20}.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;background:#4cb7e7;border:2px solid #dffbff;transform:translate(-50%,-50%)}.act{position:absolute;width:64px;height:64px;border-radius:50%;border:2px solid #c8f5ff;background:#123f55;color:#effcff;font-size:22px;font-weight:900;z-index:21}.act.pressed{filter:brightness(1.35)}.act.cool{opacity:.4}#A{right:82px;bottom:16px}#B{right:8px;bottom:88px}#X{right:156px;bottom:88px}#Y{right:82px;bottom:160px}
.modal{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(1,8,13,.82)}.modal.open{display:flex}.customPanel{width:min(860px,96vw);height:min(92%,520px);padding:10px;border:2px solid #58cce9;border-radius:14px;background:#071f2b;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:7px}.customHead{display:flex;justify-content:space-between;align-items:center;min-height:28px}.customHead h2{margin:0;font-size:20px}.hand{min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:6px}.chipCard{position:relative;min-width:0;min-height:0;padding:4px;border:2px solid #326d84;border-radius:8px;background:#0e3445;text-align:center;font-weight:900;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:3px;overflow:hidden}.chipCard.sel{border-color:#79ff72;box-shadow:0 0 10px rgba(77,255,102,.7);background:#124538}.chipCard.blocked{opacity:.28;filter:saturate(.35)}.chipCard.empty{border-style:dashed;background:#081c26;opacity:.34;pointer-events:none}.slotNo{position:absolute;left:3px;top:3px;min-width:20px;height:18px;padding:0 4px;display:grid;place-items:center;border-radius:4px;background:#1972c8;color:white;font-size:10px;z-index:2}.chipName{display:block;padding:0 20px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:18px}.chipArt{min-height:0;width:100%;height:100%;display:grid;place-items:center;border:1px solid #3f7f97;border-radius:5px;background:linear-gradient(135deg,#0a2734,#123f52);overflow:hidden;color:#72a9ba;font-size:9px;font-weight:700}.chipCard.empty .chipArt{background:#071821;color:#31505d}.chipArt img{width:100%;height:100%;object-fit:cover}.chipMeta{display:grid;grid-template-columns:30px 28px 1fr;align-items:center;height:22px;border-radius:4px;background:#06131b;overflow:hidden}.chipCode{display:grid;place-items:center;height:100%;border-right:1px solid #366a7c;color:#ffe548;font-size:13px;font-weight:1000}.chipAttr{display:grid;place-items:center;height:100%;border-right:1px solid #366a7c;color:#8bdcf5;font-size:13px}.chipValue{display:grid;place-items:center;height:100%;font-size:12px}.instruction{min-height:28px;padding:5px 8px;border:1px solid #315d70;border-radius:7px;font-size:11px;display:flex;align-items:center}.customActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.customActions button{min-height:40px;border-radius:8px;font-weight:900}.sendBtn{border:1px solid #ff6b72;background:#481d27;color:#fff}.soulBtn{border:1px solid #4ebbe8;background:#103b59;color:#9fdfff}.soulBtn:disabled{opacity:.72}.settings{width:min(340px,82vw);padding:14px;border:1px solid #58cce9;border-radius:14px;background:#082633}.settings button{width:100%;margin-top:8px;padding:10px;border:1px solid #438aa4;border-radius:8px;background:#123b4d}.portrait{display:none}@media(orientation:portrait){.portrait{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#07111b;font-weight:900}}

<main class="shell"><header class="top"><div class="chipHud"><span class="chipNow" id="chipNow">CHIP: --</span><div class="queue" id="queue"></div></div><div class="customGauge"><div class="customFill" id="customFill"></div><div class="customLabel" id="customLabel">CUSTOM 0%</div></div><button class="customBtn" id="customBtn">CUSTOM</button><button class="gear" id="gear">⚙</button></header><section class="battle" id="battle"><div class="scene" id="scene"><div class="floor"></div><div class="rangePreview cannonPreview" id="cannonPreview"></div><div class="rangePreview meleePreview" id="meleePreview"></div><div class="rangePreview bombPath" id="bombPath"></div><div class="bombTarget" id="bombTarget"></div><div class="player" id="player"></div><div class="arrow" id="arrow"></div></div><div class="joy" id="joy"><div class="knob" id="knob"></div></div><button class="act" id="Y">Y</button><button class="act" id="X">X</button><button class="act" id="B">B</button><button class="act" id="A">A</button><div class="modal" id="customModal"><div class="customPanel"><div class="customHead"><h2>CUSTOM</h2><span id="folderInfo"></span></div><div class="hand" id="hand"></div><div class="instruction">チップをタップして選択。選択中のチップをもう一度タップするとキャンセル。</div><div class="customActions"><button class="sendBtn" id="send">決定</button><button class="soulBtn" id="soulUnion" disabled>ソウルユニゾン</button></div></div></div><div class="modal" id="settingsModal"><div class="settings"><b>設定</b><button id="closeSettings">閉じる</button><button disabled>コントローラー設定（CUSTOMとの統合待ち）</button></div></div></section></main><div class="portrait">端末を横向きにしてください</div>
<script>
(()=>{
const $=id=>document.getElementById(id),battle=$('battle'),scene=$('scene'),player=$('player'),arrow=$('arrow'),joy=$('joy'),knob=$('knob'),A=$('A'),B=$('B'),X=$('X'),Y=$('Y'),cannonPreview=$('cannonPreview'),meleePreview=$('meleePreview'),bombPath=$('bombPath'),bombTarget=$('bombTarget');
const WORLD=3600,PX=.72,PY=.36,SW=WORLD*PX*2,SH=WORLD*PY*2,SPEED=260,DEAD=.12,FOLLOW=.14,CAMERA_ZOOM=.62,DASH_DIST=180,DASH_TIME=.13,DASH_CD=.65,BUSTER_RANGE=750,BUSTER_SPEED=1050,CHARGE=.85,FIRE=.67,CUSTOM_TIME=10;
const CHIP={CANNON:{name:'キャノン',type:'cannon',range:900,lock:.25},SWORD:{name:'ソード',type:'sword',range:155,width:75,lock:.25},WIDE:{name:'ワイドソード',type:'wide',range:155,width:500,lock:.28},BOMB:{name:'ミニボム',type:'bomb',range:430,radius:115,lock:.3},RECOVER:{name:'リカバリー',type:'recover',lock:.25}};
const folder=[['CANNON','A'],['SWORD','S'],['WIDE','S'],['BOMB','B'],['RECOVER','A'],['CANNON','B'],['SWORD','E'],['WIDE','E'],['BOMB','L'],['RECOVER','L'],['CANNON','C'],['SWORD','S'],['WIDE','S'],['BOMB','*'],['RECOVER','A'],['CANNON','*'],['SWORD','E'],['WIDE','E'],['BOMB','B'],['RECOVER','L'],['CANNON','A'],['SWORD','S'],['WIDE','S'],['BOMB','L'],['RECOVER','A'],['CANNON','B'],['SWORD','E'],['WIDE','E'],['BOMB','*'],['RECOVER','L']];
let uid=0;const cards=folder.map(([type,code])=>({id:uid++,type,code}));const s={x:WORLD/2,y:WORLD/2,ix:0,iy:0,dx:1,dy:0,cx:0,cy:0,last:performance.now(),dash:0,dashCd:0,dvx:0,dvy:0,bHeld:false,bAt:0,charged:false,lastShot:-1e9,lock:0,paused:true,custom:0,customReady:false,queue:[],draw:[],discard:new Set(),hand:[],selected:[]};const bullets=[];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
function proj(x,y){return{x:(x-y)*PX+SW/2,y:(x+y)*PY}}function angle(dx,dy){return Math.atan2((dx+dy)*PY,(dx-dy)*PX)*180/Math.PI}function unit(dx,dy){let x=(dx-dy)*PX,y=(dx+dy)*PY,l=Math.hypot(x,y)||1;return{x:x/l,y:y/l}}function camera(){let r=battle.getBoundingClientRect(),p=proj(s.x,s.y),vw=r.width/CAMERA_ZOOM,vh=r.height/CAMERA_ZOOM;return{x:clamp(p.x-vw/2,0,Math.max(0,SW-vw)),y:clamp(p.y-vh*.58,0,Math.max(0,SH-vh))}}
function card(id){return cards.find(c=>c.id===id)}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function resetWave(){s.draw=shuffle(cards.map(c=>c.id));s.discard.clear();s.queue=[];s.custom=0;s.customReady=false;s.hand=[];openCustom(true)}function nextHand(){s.hand=s.draw.slice(0,5);s.selected=[];renderCustom()}function openCustom(initial=false){s.paused=true;clearCharge();$('customModal').classList.add('open');if(initial||!s.hand.length)nextHand();else renderCustom()}
function validSelection(ids){if(ids.length<=1)return true;let cs=ids.map(card),sameType=cs.every(c=>c.type===cs[0].type);if(sameType)return true;let codes=new Set(cs.filter(c=>c.code!=='*').map(c=>c.code));return codes.size<=1}
function canAdd(id){if(s.selected.includes(id))return true;return validSelection([...s.selected,id])}
function renderCustom(){$('folderInfo').textContent=`フォルダ ${s.draw.length} / 使用・破棄 ${s.discard.size}`;$('hand').innerHTML='';for(let slot=0;slot<10;slot++){let id=s.hand[slot];if(id===undefined){let empty=document.createElement('div');empty.className='chipCard empty';empty.innerHTML=`<span class="slotNo">${slot+1}</span><span class="chipName">---</span><span class="chipArt">EMPTY</span><span class="chipMeta"><span class="chipCode">-</span><span class="chipAttr">○</span><span class="chipValue">--</span></span>`;$('hand').appendChild(empty);continue}let c=card(id),b=document.createElement('button'),ok=canAdd(id);b.className='chipCard'+(s.selected.includes(id)?' sel':'')+(!ok?' blocked':'');b.innerHTML=`<span class="slotNo">${slot+1}</span><span class="chipName">${CHIP[c.type].name}</span><span class="chipArt">CHIP ART</span><span class="chipMeta"><span class="chipCode">${c.code}</span><span class="chipAttr">○</span><span class="chipValue">--</span></span>`;b.disabled=!ok;b.onclick=()=>{let i=s.selected.indexOf(id);if(i>=0)s.selected.splice(i,1);else s.selected.push(id);renderCustom()};$('hand').appendChild(b)}}
$('send').onclick=()=>{if(s.selected.length){s.queue.forEach(id=>s.discard.add(id));let ss=new Set(s.selected);s.hand.forEach(id=>{let p=s.draw.indexOf(id);if(p>=0)s.draw.splice(p,1);if(!ss.has(id))s.discard.add(id)});s.queue=s.selected.slice()}else if(!s.queue.length)return;s.hand=[];s.selected=[];s.custom=0;s.customReady=false;$('customModal').classList.remove('open');s.paused=false;updateHud()};
function hidePreviews(){cannonPreview.classList.remove('show');meleePreview.classList.remove('show');bombPath.classList.remove('show');bombTarget.classList.remove('show')}
function renderPreview(){hidePreviews();if(!s.queue.length)return;let ch=CHIP[card(s.queue[0]).type];if(ch.type==='recover')return;let p=proj(s.x,s.y),a=angle(s.dx,s.dy),u=unit(s.dx,s.dy),baseY=p.y-30;if(ch.type==='cannon'){cannonPreview.style.width=(ch.range*PX)+'px';cannonPreview.style.transform=`translate(${p.x}px,${baseY-14}px) rotate(${a}deg)`;cannonPreview.classList.add('show')}else if(ch.type==='sword'||ch.type==='wide'){let h=Math.max(34,ch.width*PY);meleePreview.style.width=(ch.range*PX)+'px';meleePreview.style.height=h+'px';meleePreview.style.transform=`translate(${p.x}px,${baseY-h/2}px) rotate(${a}deg)`;meleePreview.classList.add('show')}else if(ch.type==='bomb'){bombPath.style.width=(ch.range*PX)+'px';bombPath.style.transform=`translate(${p.x}px,${baseY}px) rotate(${a}deg)`;bombPath.classList.add('show');let tx=p.x+u.x*ch.range*PX,ty=baseY+u.y*ch.range*PX,r=ch.radius*PX;bombTarget.style.width=bombTarget.style.height=r*2+'px';bombTarget.style.transform=`translate(${tx-r}px,${ty-r}px)`;bombTarget.classList.add('show')}}
function updateHud(){let cur=s.queue[0];$('chipNow').textContent='CHIP: '+(cur!==undefined?`${CHIP[card(cur).type].name} ${card(cur).code}`:'--');$('queue').innerHTML='';s.queue.slice(1).forEach(id=>{let d=document.createElement('span'),c=card(id);d.className='q';d.textContent=`${CHIP[c.type].name} ${c.code}`;$('queue').appendChild(d)});let pc=Math.min(s.custom,CUSTOM_TIME)/CUSTOM_TIME*100;$('customFill').style.width=pc+'%';$('customLabel').textContent=s.customReady?'CUSTOM OK':`CUSTOM ${Math.floor(pc)}%`;$('customBtn').classList.toggle('ready',s.customReady);renderPreview()}
function spawn(kind,range=BUSTER_RANGE,speed=BUSTER_SPEED){let d={x:s.dx,y:s.dy},l=Math.hypot(d.x,d.y)||1;d.x/=l;d.y/=l;let b={x:s.x,y:s.y,dx:d.x,dy:d.y,dist:0,range,speed,kind,el:document.createElement('div')};b.el.className='bullet '+kind;scene.appendChild(b.el);bullets.push(b)}function effect(cls,x,y,w,h){let e=document.createElement('div');e.className=cls;e.style.width=w+'px';e.style.height=h+'px';e.style.left=(x-w/2)+'px';e.style.top=(y-h/2)+'px';scene.appendChild(e);setTimeout(()=>e.remove(),700)}
function useChip(){if(s.paused||s.dash>0||s.lock>0||!s.queue.length)return;let id=s.queue.shift(),c=CHIP[card(id).type];s.discard.add(id);s.lock=c.lock||.25;let p=proj(s.x,s.y),u=unit(s.dx,s.dy);if(c.type==='cannon')spawn('cannon',c.range,900);else if(c.type==='sword'||c.type==='wide'){let cx=p.x+u.x*c.range*PX*.45,cy=p.y-30+u.y*c.range*PX*.45;effect('slash',cx,cy,c.range*PX,c.width*PY)}else if(c.type==='bomb'){let tx=p.x+u.x*c.range*PX,ty=p.y-30+u.y*c.range*PX;setTimeout(()=>effect('boom',tx,ty,c.radius*PX*2,c.radius*PX*2),280)}else effect('healPulse',p.x,p.y-36,86,86);updateHud()}
A.onpointerdown=e=>{e.preventDefault();A.classList.add('pressed');useChip()};A.onpointerup=A.onpointercancel=()=>A.classList.remove('pressed');function clearCharge(){s.bHeld=false;s.charged=false;B.classList.remove('pressed');arrow.classList.remove('charging','ready')}function bDown(e){if(s.paused||s.dash>0||s.lock>0)return;e.preventDefault();s.bHeld=true;s.bAt=performance.now();s.charged=false;B.classList.add('pressed');arrow.classList.add('charging')}function bUp(){if(!s.bHeld)return;if(s.dash>0){clearCharge();return}let held=(performance.now()-s.bAt)/1000,charged=held>=CHARGE;clearCharge();let now=performance.now()/1000;if(!charged&&now-s.lastShot<FIRE)return;if(!charged)s.lastShot=now;spawn(charged?'charged':'normal',BUSTER_RANGE,charged?820:BUSTER_SPEED)}B.addEventListener('contextmenu',e=>e.preventDefault());B.addEventListener('selectstart',e=>e.preventDefault());B.onpointerdown=bDown;B.onpointerup=bUp;B.onpointercancel=clearCharge;
function dash(){if(s.paused||s.lock>0||s.dashCd>0)return;let dx=s.ix,dy=s.iy,l=Math.hypot(dx,dy);if(l<DEAD){dx=s.dx;dy=s.dy;l=Math.hypot(dx,dy)||1}dx/=l;dy/=l;let v=DASH_DIST/DASH_TIME;s.dvx=dx*v;s.dvy=dy*v;s.dash=DASH_TIME;s.dashCd=DASH_CD;player.classList.add('dashing')}X.onpointerdown=e=>{e.preventDefault();dash()};Y.onpointerdown=()=>Y.classList.add('pressed');Y.onpointerup=Y.onpointercancel=()=>Y.classList.remove('pressed');
let jid=null;function screenToWorld(x,y){let wx=(x/PX+y/PY)/2,wy=(y/PY-x/PX)/2,l=Math.hypot(wx,wy)||1;return{x:wx/l,y:wy/l}}function joyMove(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=r.width*.335,d=Math.hypot(x,y),q=d>m?m/d:1,nx=x*q,ny=y*q,amt=Math.hypot(nx/m,ny/m);if(amt<DEAD){s.ix=s.iy=0}else{let w=screenToWorld(nx/m,ny/m);s.ix=w.x*amt;s.iy=w.y*amt;s.dx=w.x;s.dy=w.y}knob.style.transform=`translate(calc(-50% + ${nx}px),calc(-50% + ${ny}px))`;renderPreview()}function joyReset(){jid=null;s.ix=s.iy=0;knob.style.transform='translate(-50%,-50%)'}joy.onpointerdown=e=>{if(s.paused)return;jid=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)};joy.onpointermove=e=>{if(e.pointerId===jid)joyMove(e)};joy.onpointerup=joy.onpointercancel=joyReset;
$('customBtn').onclick=()=>{if(s.customReady)openCustom(false)};$('gear').onclick=()=>{$('settingsModal').classList.add('open');s.paused=true};$('closeSettings').onclick=()=>{$('settingsModal').classList.remove('open');s.paused=false};
function loop(t){let dt=Math.min((t-s.last)/1000,.05);s.last=t;if(!s.paused){if(s.lock>0)s.lock=Math.max(0,s.lock-dt);if(s.dashCd>0)s.dashCd=Math.max(0,s.dashCd-dt);if(!s.customReady){s.custom+=dt;if(s.custom>=CUSTOM_TIME){s.custom=CUSTOM_TIME;s.customReady=true}updateHud()}if(s.bHeld&&!s.charged&&(t-s.bAt)/1000>=CHARGE){s.charged=true;arrow.classList.remove('charging');arrow.classList.add('ready')}if(s.dash>0){let k=Math.min(dt,s.dash);s.x+=s.dvx*k;s.y+=s.dvy*k;s.dash-=k;if(s.dash<=0)player.classList.remove('dashing')}else if(s.lock<=0){s.x+=s.ix*SPEED*dt;s.y+=s.iy*SPEED*dt}}s.x=clamp(s.x,0,WORLD);s.y=clamp(s.y,0,WORLD);let pp=proj(s.x,s.y),ang=angle(s.dx,s.dy);player.style.transform=`translate(${pp.x-22}px,${pp.y-56}px)`;arrow.style.transform=`translate(${pp.x}px,${pp.y-30}px) rotate(${ang}deg)`;renderPreview();for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.dx*b.speed*dt;b.y+=b.dy*b.speed*dt;b.dist+=b.speed*dt;let p=proj(b.x,b.y),a=angle(b.dx,b.dy);b.el.style.transform=`translate(${p.x-9}px,${p.y-34}px) rotate(${a}deg)`;if(b.dist>=b.range){b.el.remove();bullets.splice(i,1)}}let c=camera(),f=1-Math.pow(1-FOLLOW,dt*60);s.cx=lerp(s.cx,c.x,f);s.cy=lerp(s.cy,c.y,f);scene.style.transform=`scale(${CAMERA_ZOOM}) translate(${-s.cx}px,${-s.cy}px)`;X.classList.toggle('cool',s.dashCd>0);requestAnimationFrame(loop)}
resetWave();let c=camera();s.cx=c.x;s.cy=c.y;requestAnimationFrame(loop);
})();
</script>
