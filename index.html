let ep=new Map(),gesture=null;function pd(){let a=[...ep.values()];return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}Object.entries(elements).forEach(([k,el])=>{el.addEventListener('pointerdown',e=>{if(!editMode)return;e.preventDefault();e.stopPropagation();select(k);ep.set(e.pointerId,{x:e.clientX,y:e.clientY});let s=controls[k];if(ep.size===1)gesture={mode:'drag',sx:e.clientX,sy:e.clientY,bx:k==='left'?s.x:s.right,by:k==='left'?s.y:s.bottom,k};else if(ep.size===2)gesture={mode:'pinch',d:pd(),scale:s.scale,k}});el.addEventListener('pointermove',e=>{if(!editMode||!ep.has(e.pointerId)||!gesture)return;ep.set(e.pointerId,{x:e.clientX,y:e.clientY});let s=controls[gesture.k];if(ep.size===1&&gesture.mode==='drag'){let dx=e.clientX-gesture.sx,dy=e.clientY-gesture.sy;if(gesture.k==='left'){s.x=gesture.bx+dx;s.y=gesture.by-dy}else{s.right=gesture.bx-dx;s.bottom=gesture.by-dy}}else if(ep.size>=2){s.scale=clamp(gesture.scale*pd()/gesture.d,.55,1.6)}applyControls()});['pointerup','pointercancel'].forEach(ev=>el.addEventListener(ev,e=>{ep.delete(e.pointerId);gesture=null}))});let gp=new Map(),gg=null;battleArea.addEventListener('pointerdown',e=>{if(!editMode||e.target.closest('.actionButton,.joystick,.editTopBar,.opacityFloat'))return;gp.set(e.pointerId,{x:e.clientX,y:e.clientY});if(gp.size===2){let a=[...gp.values()];gg={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),scale:controls[selectedKey].scale}}});battleArea.addEventListener('pointermove',e=>{if(!gp.has(e.pointerId)||!gg)return;gp.set(e.pointerId,{x:e.clientX,y:e.clientY});let a=[...gp.values()];if(a.length>=2){controls[selectedKey].scale=clamp(gg.scale*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/gg.d,.55,1.6);applyControls()}});['pointerup','pointercancel'].forEach(ev=>battleArea.addEventListener(ev,e=>{gp.delete(e.pointerId);if(gp.size<2)gg=null}));
