<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>BattleNetwork Prototype</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111b;color:#eafaff;font-family:system-ui,-apple-system,sans-serif}
body{padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
button{font:inherit;color:inherit}
.shell{position:relative;height:100%;display:grid;grid-template-rows:1fr auto;gap:6px}
.footer{grid-row:2;display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 8px;border:1px solid #24566b;border-radius:9px;background:#061923}
.chipHud{min-width:0;display:flex;align-items:center;gap:7px;flex:1}.chipNow{font-weight:900;white-space:nowrap}.queue{display:flex;gap:4px;min-width:0;overflow:hidden}.q{padding:3px 6px;border:1px solid #39758d;border-radius:5px;background:#0b2a38;font-size:10px;white-space:nowrap}
.customGauge{position:absolute;left:50%;top:4px;z-index:35;width:min(560px,68vw);height:18px;transform:translateX(-50%);border:3px solid #95a5ad;border-radius:4px;background:linear-gradient(180deg,#52438c,#34255e);box-shadow:0 2px 0 rgba(0,0,0,.72),inset 0 0 0 1px #222d38;overflow:visible;pointer-events:auto}
.customGauge:before{content:'CUSTOM';position:absolute;left:50%;top:20px;transform:translateX(-50%);padding:0 5px;color:#fff;font-size:15px;font-weight:1000;letter-spacing:.5px;line-height:18px;white-space:nowrap;text-shadow:-2px 0 #10151c,0 2px #10151c,2px 0 #10151c,0 -2px #10151c}
.customGauge.ready{cursor:pointer;animation:customReadyBlink .55s steps(2,end) infinite}.customGauge.ready .customFill{box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 0 11px rgba(211,250,255,.95)}
@keyframes customReadyBlink{0%,45%{filter:brightness(1)}50%,100%{filter:brightness(1.85)}}
.customFill{height:100%;width:0;border-radius:1px;background:linear-gradient(180deg,#f5ffff 0%,#c8f6ff 42%,#9bdfff 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.9);transition:width .06s linear}
.customLabel{display:none}
.gear{position:absolute;right:8px;top:4px;z-index:50;width:38px;height:36px;padding:0;display:grid;place-items:center;border:1px solid #65cce9;border-radius:9px;background:linear-gradient(180deg,#103b50,#082531);box-shadow:inset 0 0 0 1px rgba(154,241,255,.1),0 0 9px rgba(67,212,255,.14)}
.cyberGear{display:block;width:24px;height:24px;filter:drop-shadow(0 0 3px rgba(109,239,255,.7))}.cyberGear .outer{fill:#0b3241;stroke:#8cecff;stroke-width:2}.cyberGear .inner{fill:#061923;stroke:#d6fbff;stroke-width:1.8}.cyberGear .circuit{fill:none;stroke:#49cae8;stroke-width:1.6;stroke-linecap:round}.cyberGear .node{fill:#bff8ff}
.battle{grid-row:1;position:relative;min-height:0;overflow:hidden;border:2px solid #285d70;border-radius:12px;background:#07131b}
.scene{position:absolute;left:0;top:0;width:5184px;height:2592px;will-change:transform;transform-origin:0 0}
.floor{position:absolute;inset:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:repeating-linear-gradient(26.565deg,rgba(83,194,222,.14) 0 2px,transparent 2px 72px),repeating-linear-gradient(153.435deg,rgba(83,194,222,.12) 0 2px,transparent 2px 72px),linear-gradient(#173745,#0a202b)}
.player{position:absolute;width:44px;height:56px;border-radius:16px 16px 11px 11px;background:linear-gradient(#51d7ff,#1d8df2 44%,#163f8b);border:2px solid #c1f7ff;box-shadow:0 0 12px #40cbff;z-index:5}.player.dashing{filter:brightness(1.5)}
.arrow{position:absolute;width:26px;height:4px;border-radius:3px;background:#d9fbff;transform-origin:2px 50%;z-index:7;box-shadow:0 0 8px #7eeeff}.arrow:after{content:"";position:absolute;right:-3px;top:-4px;border-left:8px solid #d9fbff;border-top:6px solid transparent;border-bottom:6px solid transparent}.arrow.charging:before,.arrow.ready:before{content:"";position:absolute;right:-12px;top:-7px;width:18px;height:18px;border-radius:50%;background:#45d9ff;box-shadow:0 0 15px #2bcfff}.arrow.ready:before{width:24px;height:24px;right:-15px;top:-10px;background:#ff514e;box-shadow:0 0 18px #ff3939}
.rangePreview{position:absolute;left:0;top:0;z-index:4;pointer-events:none;transform-origin:0 50%;display:none}.rangePreview.show{display:block}.cannonPreview{height:28px;border:3px solid rgba(255,229,96,.96);background:rgba(255,229,96,.24);border-radius:14px}.meleePreview{border:3px solid rgba(112,238,255,.98);background:rgba(112,238,255,.28);border-radius:9px}.bombPath{height:5px;border-top:3px dashed rgba(255,190,86,.95)}.bombTarget{position:absolute;z-index:4;display:none;border:3px dashed rgba(255,177,70,.98);border-radius:50%;background:rgba(255,150,50,.2);pointer-events:none}.bombTarget.show{display:block}
.bullet{position:absolute;z-index:6;pointer-events:none;border-radius:50%;transform-origin:center}.bullet.normal{width:18px;height:9px;background:#66ddff;box-shadow:0 0 8px #50d9ff}.bullet.charged{width:38px;height:19px;background:#ff514e;box-shadow:0 0 12px #ff514e}.bullet.cannon{width:28px;height:14px;background:#ffd55a;box-shadow:0 0 10px #ffd55a}
.slash{position:absolute;z-index:8;border:4px solid rgba(134,244,255,.9);border-left:0;border-bottom:0;border-radius:50%;pointer-events:none;animation:slash .22s forwards}@keyframes slash{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(1.15)}}
.boom{position:absolute;z-index:8;border-radius:50%;background:rgba(255,139,44,.55);border:4px solid #ffd25e;pointer-events:none;animation:boom .35s forwards}@keyframes boom{to{transform:scale(1.35);opacity:0}}
.healPulse{position:absolute;z-index:8;border-radius:50%;pointer-events:none;border:4px solid rgba(112,255,158,.95);background:rgba(83,255,143,.18);animation:healPulse .55s ease-out forwards}@keyframes healPulse{from{transform:scale(.45);opacity:1}to{transform:scale(1.35);opacity:0}}
.joy{position:absolute;left:18px;bottom:16px;width:140px;height:140px;border-radius:50%;background:rgba(15,56,72,.72);border:2px solid #337e99;z-index:20;transform-origin:center}.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;background:#4cb7e7;border:2px solid #dffbff;transform:translate(-50%,-50%)}
.act{position:absolute;width:64px;height:64px;border-radius:50%;border:2px solid #c8f5ff;background:#123f55;font-size:22px;font-weight:900;z-index:21;transform-origin:center}.act.pressed{filter:brightness(1.35)}.act.cool{opacity:.4}#A{right:82px;bottom:16px}#B{right:8px;bottom:88px}#X{right:156px;bottom:88px}#Y{right:82px;bottom:160px}
.editTarget{outline:3px solid rgba(255,226,102,.95);outline-offset:6px;filter:drop-shadow(0 0 10px rgba(255,217,77,.45))}.editMode .joy,.editMode .act{cursor:move}.editShade{position:absolute;inset:0;z-index:20;pointer-events:none;background:rgba(1,8,13,.08)}.editTopBar{position:absolute;left:50%;top:44px;z-index:65;display:none;align-items:center;gap:8px;transform:translateX(-50%);padding:6px 8px;border:1px solid rgba(120,222,255,.5);border-radius:10px;background:rgba(5,24,34,.94);color:#effcff}.editTopBar.open{display:flex}.editTopBar .label{font-size:12px;font-weight:800;white-space:nowrap}.editTopBar button{height:30px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:800}.resetSettings{border:1px solid rgba(255,190,120,.5);background:#3b2818;color:#ffe5c6}.doneSettings{border:1px solid rgba(112,220,255,.5);background:#12384a;color:#eaffff}.opacityFloat{position:absolute;left:50%;bottom:8px;z-index:66;display:none;width:min(220px,38vw);transform:translateX(-50%);padding:6px 8px;border:1px solid rgba(120,222,255,.45);border-radius:9px;background:rgba(5,24,34,.9);color:#effcff}.opacityFloat.show{display:block}.opacityFloat .title{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;font-size:10px;font-weight:800}.opacityFloat input{width:100%;touch-action:auto}.selectionLabel{position:absolute;z-index:64;display:none;padding:4px 8px;border-radius:7px;background:rgba(255,220,86,.95);color:#182028;font-size:11px;font-weight:900;pointer-events:none}.selectionLabel.show{display:block}
.modal{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(1,8,13,.82)}.modal.open{display:flex}
.customPanel{width:min(900px,98vw);height:calc(100% - 8px);padding:8px;border:2px solid #58cce9;border-radius:14px;background:#071f2b;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:6px}.customHead{display:flex;justify-content:space-between;align-items:center;min-height:26px}.customHead h2{margin:0;font-size:20px}.handViewport{min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:5px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;scroll-snap-type:y proximity}.handViewport,.handViewport *{touch-action:pan-y}.hand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:176px;gap:8px;padding-bottom:8px}.chipCard{position:relative;min-width:0;height:176px;padding:5px;border:2px solid #326d84;border-radius:8px;background:#0e3445;text-align:center;font-weight:900;display:grid;grid-template-rows:20px 116px 24px;gap:3px;overflow:hidden;scroll-snap-align:start}.chipCard.sel{border-color:#79ff72;box-shadow:0 0 10px rgba(77,255,102,.7);background:#124538}.chipCard.blocked{opacity:.28}.chipCard.empty{border-style:dashed;background:#081c26;opacity:.34;pointer-events:none}.slotNo{position:absolute;left:3px;top:3px;min-width:20px;height:18px;padding:0 4px;display:grid;place-items:center;border-radius:4px;background:#1972c8;font-size:10px}.chipName{display:block;padding:0 20px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:18px}.chipArt{width:100%;height:116px;border:1px solid #3f7f97;border-radius:5px;background:linear-gradient(135deg,#0a2734,#123f52);overflow:hidden}.chipArt img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;pointer-events:none}.chipMeta{display:grid;grid-template-columns:30px 30px 1fr;align-items:center;height:24px;border-radius:4px;background:#06131b;overflow:hidden}.chipCode{display:grid;place-items:center;height:100%;border-right:1px solid #366a7c;color:#ffe548;font-size:13px}.chipAttr{display:grid;place-items:center;height:100%;border-right:1px solid #366a7c}.attrIcon{width:20px;height:20px;display:block;object-fit:contain}.chipValue{display:grid;place-items:center;height:100%;font-size:12px}.instruction{min-height:26px;padding:4px 8px;border:1px solid #315d70;border-radius:7px;font-size:11px;display:flex;align-items:center}.customActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.customActions button{min-height:38px;border-radius:8px;font-weight:900}.sendBtn{border:1px solid #ff6b72;background:#481d27}.soulBtn{border:1px solid #4ebbe8;background:#103b59;color:#9fdfff}.soulBtn:disabled{opacity:.72}
.settings{width:min(360px,84vw);padding:12px;border:1px solid #58cce9;border-radius:14px;background:#082633;box-shadow:0 12px 36px rgba(0,0,0,.45)}.settingsHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.settingsHead b{font-size:16px}.settingsClose{display:grid;place-items:center;width:32px;height:32px;padding:0;border:1px solid #438aa4;border-radius:8px;background:#123b4d;font-size:20px}.settingsList{display:grid;gap:8px}.settingsItem{width:100%;min-height:52px;padding:8px 12px;border:1px solid #438aa4;border-radius:10px;background:linear-gradient(180deg,#12384a,#0b2938);text-align:left;font-weight:800}.settingsItem small{display:block;margin-top:3px;color:#8fd8ed;font-size:10px;font-weight:600}
.portrait{display:none}@media(orientation:portrait){.portrait{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#07111b;font-weight:900}}
</style>
</head>
<body>
<main class="shell">
  <footer class="footer">
    <div class="chipHud"><span class="chipNow" id="chipNow">CHIP: --</span><div class="queue" id="queue"></div></div>
  </footer>
  <div class="customGauge" id="customGauge" role="button" aria-label="CUSTOM"><div class="customFill" id="customFill"></div><div class="customLabel" id="customLabel"></div></div>
  <button class="gear" id="gear" type="button" aria-label="設定">
    <svg class="cyberGear" viewBox="0 0 32 32" aria-hidden="true">
      <path class="outer" d="M13 2h6l1.2 4.1 3.1 1.3 3.8-2.1 4.2 4.2-2.1 3.8 1.3 3.1L34 17v6l-3.5.6-1.3 3.1 2.1 3.8-4.2 4.2-3.8-2.1-3.1 1.3L19 38h-6l-1.2-4.1-3.1-1.3-3.8 2.1-4.2-4.2 2.1-3.8-1.3-3.1L-2 23v-6l3.5-.6 1.3-3.1-2.1-3.8 4.2-4.2 3.8 2.1 3.1-1.3z" transform="scale(.78) translate(4.7 1.7)"/>
      <hexagon></hexagon>
      <path class="inner" d="M16 10l5 3v6l-5 3-5-3v-6z"/>
      <path class="circuit" d="M16 5v5M27 16h-6M16 27v-5M5 16h6"/>
      <circle class="node" cx="16" cy="5" r="1.3"/><circle class="node" cx="27" cy="16" r="1.3"/><circle class="node" cx="16" cy="27" r="1.3"/><circle class="node" cx="5" cy="16" r="1.3"/>
    </svg>
  </button>
  <section class="battle" id="battle">
    <div class="scene" id="scene"><div class="floor"></div><div class="rangePreview cannonPreview" id="cannonPreview"></div><div class="rangePreview meleePreview" id="meleePreview"></div><div class="rangePreview bombPath" id="bombPath"></div><div class="bombTarget" id="bombTarget"></div><div class="player" id="player"></div><div class="arrow" id="arrow"></div></div>
    <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
    <button class="act" id="Y">Y</button><button class="act" id="X">X</button><button class="act" id="B">B</button><button class="act" id="A">A</button>
    <div class="editShade" id="editShade" hidden></div><div class="selectionLabel" id="selectionLabel"></div>
    <div class="editTopBar" id="editTopBar"><span class="label">配置編集</span><button id="resetSettings" class="resetSettings" type="button">デフォルトに戻す</button><button id="doneSettings" class="doneSettings" type="button">完了</button></div>
    <div class="opacityFloat" id="opacityFloat"><div class="title"><span id="selectedName">未選択</span><span id="opacityValue">100%</span></div><input id="opacitySlider" type="range" min="20" max="100" step="5" value="100"></div>
    <div class="modal" id="customModal"><div class="customPanel"><div class="customHead"><h2>CUSTOM</h2><span id="folderInfo"></span></div><div class="handViewport"><div class="hand" id="hand"></div></div><div class="instruction">チップをタップして選択。選択中のチップをもう一度タップするとキャンセル。</div><div class="customActions"><button class="sendBtn" id="send">決定</button><button class="soulBtn" disabled>ソウルユニゾン</button></div></div></div>
    <div class="modal" id="settingsModal"><div class="settings"><div class="settingsHead"><b>設定</b><button id="closeSettings" class="settingsClose" type="button" aria-label="設定を閉じる">×</button></div><div class="settingsList"><button id="controllerSettingsItem" class="settingsItem" type="button">コントローラー設定<small>配置・サイズ・透明度を変更</small></button></div></div></div>
  </section>
</main>
<div class="portrait">端末を横向きにしてください</div>
<script>
(()=>{
const $=id=>document.getElementById(id),battle=$('battle'),scene=$('scene'),player=$('player'),arrow=$('arrow'),joy=$('joy'),knob=$('knob'),A=$('A'),B=$('B'),X=$('X'),Y=$('Y'),cannonPreview=$('cannonPreview'),meleePreview=$('meleePreview'),bombPath=$('bombPath'),bombTarget=$('bombTarget');
const WORLD=3600,PX=.72,PY=.36,SW=WORLD*PX*2,SH=WORLD*PY*2,SPEED=260,DEAD=.12,FOLLOW=.14,CAMERA_ZOOM=.62,DASH_DIST=180,DASH_TIME=.13,DASH_CD=.65,BUSTER_RANGE=750,BUSTER_SPEED=1050,CHARGE=.85,FIRE=.67,CUSTOM_TIME=10;
const CHIP={CANNON:{name:'キャノン',type:'cannon',attr:'normal',range:900,lock:.25,image:'./assets/chips/cannon.png'},SWORD:{name:'ソード',type:'sword',attr:'sword',range:155,width:75,lock:.25,image:'./assets/chips/sword.png'},WIDE:{name:'ワイドソード',type:'wide',attr:'sword',range:155,width:500,lock:.28,image:'./assets/chips/WideSwordpng.png'},BOMB:{name:'ミニボム',type:'bomb',attr:'normal',range:430,radius:115,lock:.3,image:'./assets/chips/MiniBomb.png'},RECOVER:{name:'リカバリー10',type:'recover',attr:'recovery',heal:10,lock:.25,image:'./assets/chips/Recovery_10.png'}};
const ATTR_IMAGE={normal:'./assets/attributes/01_normal.png',fire:'./assets/attributes/02_fire.png',water:'./assets/attributes/03_water.png',electric:'./assets/attributes/04_electric.png',wood:'./assets/attributes/05_wood.png',terrain_break:'./assets/attributes/06_terrain_break.png',recovery:'./assets/attributes/07_recovery.png',sword:'./assets/attributes/08_sword.png',wind:'./assets/attributes/09_wind.png',invisible:'./assets/attributes/10_invisible.png',object:'./assets/attributes/11_object.png',plus:'./assets/attributes/12_plus.png',break:'./assets/attributes/13_break.png'},ATTR_LABEL={normal:'無属性',fire:'炎',water:'水',electric:'電気',wood:'木',terrain_break:'地形破壊',recovery:'リカバリー',sword:'ソード',wind:'風',invisible:'インビジブル',object:'置物',plus:'数値付加',break:'ブレイク'};
const folder=[['CANNON','A'],['SWORD','S'],['WIDE','S'],['BOMB','B'],['RECOVER','A'],['CANNON','B'],['SWORD','E'],['WIDE','E'],['BOMB','L'],['RECOVER','L'],['CANNON','C'],['SWORD','S'],['WIDE','S'],['BOMB','*'],['RECOVER','A'],['CANNON','*'],['SWORD','E'],['WIDE','E'],['BOMB','B'],['RECOVER','L'],['CANNON','A'],['SWORD','S'],['WIDE','S'],['BOMB','L'],['RECOVER','A'],['CANNON','B'],['SWORD','E'],['WIDE','E'],['BOMB','*'],['RECOVER','L']];
let uid=0;const cards=folder.map(([type,code])=>({id:uid++,type,code}));
const s={x:WORLD/2,y:WORLD/2,ix:0,iy:0,dx:1,dy:0,cx:0,cy:0,last:performance.now(),dash:0,dashCd:0,dvx:0,dvy:0,bHeld:false,bAt:0,charged:false,lastShot:-1e9,lock:0,paused:true,custom:0,customReady:false,queue:[],draw:[],discard:new Set(),hand:[],selected:[]},bullets=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
let editMode=false,menuOpen=false;
const defaults={left:{x:18,bottom:16,scale:1,opacity:1},A:{right:82,bottom:16,scale:1,opacity:1},B:{right:8,bottom:88,scale:1,opacity:1},X:{right:156,bottom:88,scale:1,opacity:1},Y:{right:82,bottom:160,scale:1,opacity:1}};
let controlSettings=loadSettings(),selectedKey=null,editPointers=new Map(),gesture=null;
const elements={left:joy,A,B,X,Y},names={left:'左スティック',A:'Aボタン',B:'Bボタン',X:'Xボタン',Y:'Yボタン'};
function cloneDefaults(){return JSON.parse(JSON.stringify(defaults))}
function loadSettings(){try{const v=JSON.parse(localStorage.getItem('battleNetworkControlsV3'));return v&&v.left&&v.A&&v.B&&v.X&&v.Y?v:cloneDefaults()}catch{return cloneDefaults()}}
function saveSettings(){localStorage.setItem('battleNetworkControlsV3',JSON.stringify(controlSettings))}
function applyControls(){const l=controlSettings.left;joy.style.left=l.x+'px';joy.style.bottom=l.bottom+'px';joy.style.transform=`scale(${l.scale})`;joy.style.opacity=l.opacity;['A','B','X','Y'].forEach(k=>{const el=elements[k],v=controlSettings[k];el.style.right=v.right+'px';el.style.bottom=v.bottom+'px';el.style.transform=`scale(${v.scale})`;el.style.opacity=v.opacity});updateSelectionLabel()}
function proj(x,y){return{x:(x-y)*PX+SW/2,y:(x+y)*PY}}
function angle(dx,dy){return Math.atan2((dx+dy)*PY,(dx-dy)*PX)*180/Math.PI}
function unit(dx,dy){let x=(dx-dy)*PX,y=(dx+dy)*PY,l=Math.hypot(x,y)||1;return{x:x/l,y:y/l}}
function camera(){let r=battle.getBoundingClientRect(),p=proj(s.x,s.y),vw=r.width/CAMERA_ZOOM,vh=r.height/CAMERA_ZOOM;return{x:clamp(p.x-vw/2,0,SW-vw),y:clamp(p.y-vh*.58,0,SH-vh)}}
function card(id){return cards.find(c=>c.id===id)}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function resetWave(){s.draw=shuffle(cards.map(c=>c.id));s.discard.clear();s.queue=[];s.custom=0;s.customReady=false;s.hand=[];openCustom(true)}
function nextHand(){s.hand=s.draw.slice(0,5);s.selected=[];renderCustom()}
function openCustom(initial=false){s.paused=true;joyReset();clearCharge();$('customModal').classList.add('open');if(initial||!s.hand.length)nextHand();else renderCustom()}
function validSelection(ids){if(ids.length<=1)return true;let cs=ids.map(card);if(cs.every(c=>c.type===cs[0].type))return true;return new Set(cs.filter(c=>c.code!=='*').map(c=>c.code)).size<=1}
function canAdd(id){return s.selected.includes(id)||validSelection([...s.selected,id])}
function attrHtml(type){let attr=CHIP[type].attr,src=ATTR_IMAGE[attr]||ATTR_IMAGE.normal,label=ATTR_LABEL[attr]||ATTR_LABEL.normal;return `<img class="attrIcon" src="${src}" alt="${label}" draggable="false">`}
function chipArtHtml(type){let src=CHIP[type].image;return src?`<img src="${src}" alt="${CHIP[type].name}" draggable="false">`:''}
function renderCustom(){$('folderInfo').textContent=`フォルダ ${s.draw.length} / 使用・破棄 ${s.discard.size}`;$('hand').innerHTML='';for(let slot=0;slot<10;slot++){let id=s.hand[slot];if(id===undefined){let e=document.createElement('div');e.className='chipCard empty';e.innerHTML=`<span class="slotNo">${slot+1}</span><span class="chipName">---</span><span class="chipArt"></span><span class="chipMeta"><span class="chipCode">-</span><span class="chipAttr"></span><span class="chipValue">--</span></span>`;$('hand').appendChild(e);continue}let c=card(id),b=document.createElement('button'),ok=canAdd(id);b.className='chipCard'+(s.selected.includes(id)?' sel':'')+(!ok?' blocked':'');b.innerHTML=`<span class="slotNo">${slot+1}</span><span class="chipName">${CHIP[c.type].name}</span><span class="chipArt">${chipArtHtml(c.type)}</span><span class="chipMeta"><span class="chipCode">${c.code}</span><span class="chipAttr">${attrHtml(c.type)}</span><span class="chipValue">--</span></span>`;b.disabled=!ok;b.onclick=()=>{let i=s.selected.indexOf(id);i>=0?s.selected.splice(i,1):s.selected.push(id);renderCustom()};$('hand').appendChild(b)}}
$('send').onclick=()=>{if(s.selected.length){s.queue.forEach(id=>s.discard.add(id));let ss=new Set(s.selected);s.hand.forEach(id=>{let p=s.draw.indexOf(id);if(p>=0)s.draw.splice(p,1);if(!ss.has(id))s.discard.add(id)});s.queue=s.selected.slice()}else if(!s.queue.length)return;s.hand=[];s.selected=[];s.custom=0;s.customReady=false;$('customModal').classList.remove('open');s.paused=false;updateHud()};
function hidePreviews(){cannonPreview.classList.remove('show');meleePreview.classList.remove('show');bombPath.classList.remove('show');bombTarget.classList.remove('show')}
function renderPreview(){hidePreviews();if(!s.queue.length)return;let ch=CHIP[card(s.queue[0]).type];if(ch.type==='recover')return;let p=proj(s.x,s.y),a=angle(s.dx,s.dy),u=unit(s.dx,s.dy),baseY=p.y-30;if(ch.type==='cannon'){cannonPreview.style.width=ch.range*PX+'px';cannonPreview.style.transform=`translate(${p.x}px,${baseY-14}px) rotate(${a}deg)`;cannonPreview.classList.add('show')}else if(ch.type==='sword'||ch.type==='wide'){let h=Math.max(34,ch.width*PY);meleePreview.style.width=ch.range*PX+'px';meleePreview.style.height=h+'px';meleePreview.style.transform=`translate(${p.x}px,${baseY-h/2}px) rotate(${a}deg)`;meleePreview.classList.add('show')}else if(ch.type==='bomb'){bombPath.style.width=ch.range*PX+'px';bombPath.style.transform=`translate(${p.x}px,${baseY}px) rotate(${a}deg)`;bombPath.classList.add('show');let tx=p.x+u.x*ch.range*PX,ty=baseY+u.y*ch.range*PX,r=ch.radius*PX;bombTarget.style.width=bombTarget.style.height=r*2+'px';bombTarget.style.transform=`translate(${tx-r}px,${ty-r}px)`;bombTarget.classList.add('show')}}
function updateHud(){let cur=s.queue[0];$('chipNow').textContent='CHIP: '+(cur!==undefined?`${CHIP[card(cur).type].name} ${card(cur).code}`:'--');$('queue').innerHTML='';s.queue.slice(1).forEach(id=>{let d=document.createElement('span'),c=card(id);d.className='q';d.textContent=`${CHIP[c.type].name} ${c.code}`;$('queue').appendChild(d)});let pc=Math.min(s.custom,CUSTOM_TIME)/CUSTOM_TIME*100;$('customFill').style.width=pc+'%';$('customGauge').classList.toggle('ready',s.customReady);$('customGauge').setAttribute('aria-disabled',s.customReady?'false':'true');renderPreview()}
function spawn(kind,range=BUSTER_RANGE,speed=BUSTER_SPEED){let d={x:s.dx,y:s.dy},l=Math.hypot(d.x,d.y)||1;d.x/=l;d.y/=l;let b={x:s.x,y:s.y,dx:d.x,dy:d.y,dist:0,range,speed,kind,el:document.createElement('div')};b.el.className='bullet '+kind;scene.appendChild(b.el);bullets.push(b)}
function effect(cls,x,y,w,h){let e=document.createElement('div');e.className=cls;e.style.cssText=`width:${w}px;height:${h}px;left:${x-w/2}px;top:${y-h/2}px`;scene.appendChild(e);setTimeout(()=>e.remove(),700)}
function useChip(){if(s.paused||s.dash>0||s.lock>0||!s.queue.length||editMode)return;let id=s.queue.shift(),c=CHIP[card(id).type];s.discard.add(id);s.lock=c.lock||.25;let p=proj(s.x,s.y),u=unit(s.dx,s.dy);if(c.type==='cannon')spawn('cannon',c.range,900);else if(c.type==='sword'||c.type==='wide')effect('slash',p.x+u.x*c.range*PX*.45,p.y-30+u.y*c.range*PX*.45,c.range*PX,c.width*PY);else if(c.type==='bomb')setTimeout(()=>effect('boom',p.x+u.x*c.range*PX,p.y-30+u.y*c.range*PX,c.radius*PX*2,c.radius*PX*2),280);else effect('healPulse',p.x,p.y-36,86,86);updateHud()}
A.onpointerdown=e=>{if(editMode)return;e.preventDefault();A.classList.add('pressed');useChip()};A.onpointerup=A.onpointercancel=()=>A.classList.remove('pressed');
function clearCharge(){s.bHeld=false;s.charged=false;B.classList.remove('pressed');arrow.classList.remove('charging','ready')}
function bDown(e){if(editMode||s.paused||s.dash>0||s.lock>0)return;e.preventDefault();s.bHeld=true;s.bAt=performance.now();s.charged=false;B.classList.add('pressed');arrow.classList.add('charging')}
function bUp(){if(editMode||!s.bHeld)return;if(s.dash>0){clearCharge();return}let charged=(performance.now()-s.bAt)/1000>=CHARGE;clearCharge();let now=performance.now()/1000;if(!charged&&now-s.lastShot<FIRE)return;if(!charged)s.lastShot=now;spawn(charged?'charged':'normal',BUSTER_RANGE,charged?820:BUSTER_SPEED)}
B.onpointerdown=bDown;B.onpointerup=bUp;B.onpointercancel=clearCharge;
function dash(){if(editMode||s.paused||s.lock>0||s.dashCd>0)return;let dx=s.ix,dy=s.iy,l=Math.hypot(dx,dy);if(l<DEAD){dx=s.dx;dy=s.dy;l=Math.hypot(dx,dy)||1}dx/=l;dy/=l;s.dvx=dx*DASH_DIST/DASH_TIME;s.dvy=dy*DASH_DIST/DASH_TIME;s.dash=DASH_TIME;s.dashCd=DASH_CD;player.classList.add('dashing')}
X.onpointerdown=e=>{if(editMode)return;e.preventDefault();dash()};
let jid=null;function screenToWorld(x,y){let wx=(x/PX+y/PY)/2,wy=(y/PY-x/PX)/2,l=Math.hypot(wx,wy)||1;return{x:wx/l,y:wy/l}}
function joyMove(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=r.width*.335,d=Math.hypot(x,y),q=d>m?m/d:1,nx=x*q,ny=y*q,amt=Math.hypot(nx/m,ny/m);if(amt<DEAD)s.ix=s.iy=0;else{let w=screenToWorld(nx/m,ny/m);s.ix=w.x*amt;s.iy=w.y*amt;s.dx=w.x;s.dy=w.y}knob.style.transform=`translate(calc(-50% + ${nx}px),calc(-50% + ${ny}px))`;renderPreview()}
function joyReset(){jid=null;s.ix=s.iy=0;knob.style.transform='translate(-50%,-50%)'}
joy.onpointerdown=e=>{if(editMode||s.paused)return;jid=e.pointerId;joy.setPointerCapture?.(e.pointerId);joyMove(e)};joy.onpointermove=e=>{if(e.pointerId===jid)joyMove(e)};joy.onpointerup=joy.onpointercancel=joyReset;
$('customGauge').addEventListener('pointerdown',e=>{if(!s.customReady||s.paused||editMode)return;e.preventDefault();e.stopPropagation();openCustom(false)});
function openSettingsMenu(){if(editMode)return;menuOpen=true;joyReset();clearCharge();s.paused=true;$('settingsModal').classList.add('open')}
function closeSettingsMenu(resume=true){menuOpen=false;$('settingsModal').classList.remove('open');if(resume&&!editMode&&!$('customModal').classList.contains('open'))s.paused=false}
$('gear').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();openSettingsMenu()});$('closeSettings').onclick=()=>closeSettingsMenu(true);$('settingsModal').addEventListener('pointerdown',e=>{if(e.target===$('settingsModal'))closeSettingsMenu(true)});
function selectTarget(key){if(selectedKey)elements[selectedKey].classList.remove('editTarget');selectedKey=key;elements[key].classList.add('editTarget');$('selectedName').textContent=names[key];$('opacitySlider').value=Math.round(controlSettings[key].opacity*100);$('opacityValue').textContent=$('opacitySlider').value+'%';$('opacityFloat').classList.add('show');updateSelectionLabel()}
function updateSelectionLabel(){if(!editMode||!selectedKey){$('selectionLabel').classList.remove('show');return}const r=elements[selectedKey].getBoundingClientRect(),b=battle.getBoundingClientRect();$('selectionLabel').textContent=names[selectedKey];$('selectionLabel').style.left=clamp(r.left-b.left,4,b.width-90)+'px';$('selectionLabel').style.top=clamp(r.top-b.top-28,4,b.height-24)+'px';$('selectionLabel').classList.add('show')}
function startEdit(){closeSettingsMenu(false);editMode=true;s.paused=true;battle.classList.add('editMode');$('editShade').hidden=false;$('editTopBar').classList.add('open');selectTarget(selectedKey||'left');joyReset()}
function endEdit(){editMode=false;battle.classList.remove('editMode');$('editShade').hidden=true;$('editTopBar').classList.remove('open');$('opacityFloat').classList.remove('show');$('selectionLabel').classList.remove('show');if(selectedKey)elements[selectedKey].classList.remove('editTarget');editPointers.clear();gesture=null;globalPinchPointers.clear();globalPinch=null;saveSettings();openSettingsMenu()}
$('controllerSettingsItem').onclick=startEdit;$('doneSettings').onclick=endEdit;$('resetSettings').onclick=()=>{controlSettings=cloneDefaults();applyControls();if(selectedKey)selectTarget(selectedKey);saveSettings()};$('opacitySlider').addEventListener('input',()=>{if(!selectedKey)return;controlSettings[selectedKey].opacity=Number($('opacitySlider').value)/100;$('opacityValue').textContent=$('opacitySlider').value+'%';applyControls();saveSettings()});
function pointerDistance(){const arr=[...editPointers.values()];if(arr.length<2)return 0;return Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y)}
Object.entries(elements).forEach(([key,el])=>{el.addEventListener('pointerdown',e=>{if(!editMode)return;e.preventDefault();e.stopPropagation();selectTarget(key);el.setPointerCapture?.(e.pointerId);editPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(editPointers.size===1){const v=controlSettings[key];gesture={mode:'drag',startX:e.clientX,startY:e.clientY,baseX:key==='left'?v.x:v.right,baseY:v.bottom,baseScale:v.scale,key}}else if(editPointers.size===2){gesture={mode:'pinch',startDist:pointerDistance(),baseScale:controlSettings[key].scale,key}}});el.addEventListener('pointermove',e=>{if(!editMode||!editPointers.has(e.pointerId)||!gesture)return;editPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const v=controlSettings[gesture.key];if(gesture.mode==='drag'&&editPointers.size===1){const dx=e.clientX-gesture.startX,dy=e.clientY-gesture.startY;if(gesture.key==='left'){v.x=clamp(gesture.baseX+dx,-40,battle.clientWidth-60);v.bottom=clamp(gesture.baseY-dy,-40,battle.clientHeight-60)}else{v.right=clamp(gesture.baseX-dx,-40,battle.clientWidth-60);v.bottom=clamp(gesture.baseY-dy,-40,battle.clientHeight-60)}applyControls()}else if(editPointers.size>=2){const d=pointerDistance();if(!gesture.startDist)gesture.startDist=d;v.scale=clamp(gesture.baseScale*(d/gesture.startDist),.55,1.6);applyControls()}});const end=e=>{if(!editMode)return;editPointers.delete(e.pointerId);gesture=null;saveSettings()};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('lostpointercapture',end)});
const globalPinchPointers=new Map();let globalPinch=null;function globalPinchDistance(){const p=[...globalPinchPointers.values()];return p.length<2?0:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}function isEditUiTarget(target){return !!target.closest('.editTopBar,.opacityFloat')}
battle.addEventListener('pointerdown',e=>{if(!editMode||!selectedKey||isEditUiTarget(e.target)||e.target.closest('.joy,.act'))return;globalPinchPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});battle.setPointerCapture?.(e.pointerId);if(globalPinchPointers.size===2)globalPinch={startDist:globalPinchDistance(),baseScale:controlSettings[selectedKey].scale,key:selectedKey}});battle.addEventListener('pointermove',e=>{if(!editMode||!globalPinchPointers.has(e.pointerId))return;globalPinchPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(globalPinchPointers.size>=2&&globalPinch){const d=globalPinchDistance();if(globalPinch.startDist>0){controlSettings[globalPinch.key].scale=clamp(globalPinch.baseScale*(d/globalPinch.startDist),.55,1.6);applyControls()}}});function endGlobalPinch(e){if(!globalPinchPointers.has(e.pointerId))return;globalPinchPointers.delete(e.pointerId);if(globalPinchPointers.size<2){globalPinch=null;saveSettings()}}battle.addEventListener('pointerup',endGlobalPinch);battle.addEventListener('pointercancel',endGlobalPinch);battle.addEventListener('lostpointercapture',endGlobalPinch);
function loop(t){let dt=Math.min((t-s.last)/1000,.05);s.last=t;if(!s.paused&&!editMode&&!menuOpen){if(s.lock>0)s.lock=Math.max(0,s.lock-dt);if(s.dashCd>0)s.dashCd=Math.max(0,s.dashCd-dt);if(!s.customReady){s.custom+=dt;if(s.custom>=CUSTOM_TIME){s.custom=CUSTOM_TIME;s.customReady=true}updateHud()}if(s.bHeld&&!s.charged&&(t-s.bAt)/1000>=CHARGE){s.charged=true;arrow.classList.remove('charging');arrow.classList.add('ready')}if(s.dash>0){let k=Math.min(dt,s.dash);s.x+=s.dvx*k;s.y+=s.dvy*k;s.dash-=k;if(s.dash<=0)player.classList.remove('dashing')}else if(s.lock<=0){s.x+=s.ix*SPEED*dt;s.y+=s.iy*SPEED*dt}}s.x=clamp(s.x,0,WORLD);s.y=clamp(s.y,0,WORLD);let pp=proj(s.x,s.y),ang=angle(s.dx,s.dy);player.style.transform=`translate(${pp.x-22}px,${pp.y-56}px)`;arrow.style.transform=`translate(${pp.x}px,${pp.y-30}px) rotate(${ang}deg)`;renderPreview();for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.dx*b.speed*dt;b.y+=b.dy*b.speed*dt;b.dist+=b.speed*dt;let p=proj(b.x,b.y),a=angle(b.dx,b.dy);b.el.style.transform=`translate(${p.x-9}px,${p.y-34}px) rotate(${a}deg)`;if(b.dist>=b.range){b.el.remove();bullets.splice(i,1)}}let c=camera(),f=1-Math.pow(1-FOLLOW,dt*60);s.cx=lerp(s.cx,c.x,f);s.cy=lerp(s.cy,c.y,f);scene.style.transform=`scale(${CAMERA_ZOOM}) translate(${-s.cx}px,${-s.cy}px)`;X.classList.toggle('cool',s.dashCd>0);requestAnimationFrame(loop)}
window.addEventListener('resize',updateSelectionLabel);applyControls();resetWave();let c=camera();s.cx=c.x;s.cy=c.y;requestAnimationFrame(loop)
})();
</script>
