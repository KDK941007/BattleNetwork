name: Apply v91 verification status
on:
  push:
    paths:
      - '.github/workflows/apply-v91-verification.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v91 verification
        run: python tools/apply_v91_verification.py
      - name: Commit v91 verification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_STATUS.md
          git commit -m 'Record v91 device verification'
          git rm tools/apply_v91_verification.py .github/workflows/apply-v91-verification.yml
          git commit -m 'Remove one-time v91 verification files'
          git push origin main
