name: Apply v94 verification status
on:
  push:
    paths:
      - '.github/workflows/apply-v94-verification.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v94 verification
        run: python tools/apply_v94_verified_status.py
      - name: Commit v94 verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_STATUS.md
          git commit -m "Record v94 device verification" || true
          git push
      - name: Remove one-time verification files
        run: |
          git pull --rebase
          rm -f tools/apply_v94_verified_status.py .github/workflows/apply-v94-verification.yml
          git add -A
          git commit -m "Remove one-time v94 verification files" || true
          git push
