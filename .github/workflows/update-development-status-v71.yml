name: Update development status v71

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-development-status-v71.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update DEVELOPMENT_STATUS
        shell: python
        run: |
          from pathlib import Path
          path = Path('DEVELOPMENT_STATUS.md')
          text = path.read_text(encoding='utf-8')

          old = "v70で最終確認時に残っていたテストチップUIの `chip.imagePath` 直接参照を解消し、正式チップと同じ `BattleNetworkMaster.getChipImagePath()` 経由へ統一した。正式マスタへ画像項目は戻さず、テスト用画像流用もサービス層の互換定義から解決する。v70は実機確認待ち。"
          new = "v70で最終確認時に残っていたテストチップUIの `chip.imagePath` 直接参照を解消し、正式チップと同じ `BattleNetworkMaster.getChipImagePath()` 経由へ統一した。正式マスタへ画像項目は戻さず、テスト用画像流用もサービス層の互換定義から解決する。正式5チップの日本語ファイル名画像がCUSTOM・詳細で表示されることを実機確認済み。\nv71でチップ詳細Range図のP配置を固定左寄せから中央優先へ変更した。7×5グリッドの中央マスを第一候補とし、Range全体が収まる場合は中央配置、見切れる場合のみRange形状・射程・投擲距離・半径に応じて中央に最も近い収容可能マスへPを自動補正する。ソード・ワイドソード・リカバリーは中央配置、キャノン等の長射程は必要に応じて左へ寄せる。攻撃範囲のマス境界一致と正式Range値は変更していない。v71は実機確認待ち。"
          if old not in text:
              raise SystemExit('v70 status paragraph not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              '- v69チップ名ベース画像解決と日本語ファイル名の実機確認。',
              '- v71チップ詳細Range図のP中央優先配置と見切れ時自動補正の実機確認。',
              1
          )

          old_phase = "v67でチップ詳細の範囲図を論理マス縮尺へ更新した。\nまずv67の各チップ範囲図を実機確認し、問題なければ敵HP・ダメージ処理の最小基盤へ進む。"
          new_phase = "v68で非投擲系の範囲図をマス境界へ一致させ、実機確認済み。\nv70でチップ名ベース画像解決の実機確認も完了した。\nv71でPを中央優先・見切れ時のみ自動補正する表示へ更新したため、まずv71の配置を実機確認し、問題なければ敵HP・ダメージ処理の最小基盤へ進む。"
          if old_phase not in text:
              raise SystemExit('next phase paragraph not found')
          text = text.replace(old_phase, new_phase, 1)

          old_priority = "1. キャノン詳細図が `5×0.75マス` の長さ・幅として見えることを確認する。\n2. ソード `1×1`、ワイドソード `1×3`、ミニボム `3マス先 / 半径0.75`、リカバリー10 `SELF` がマス図へ正しく反映されることを確認する。\n3. 既存のチップ詳細レイアウトに崩れがないことを確認する。\n4. 配置編集バーとY方向固定のv65確認が未完なら合わせて確認する。\n5. 敵HPの最小基盤を追加する。\n6. バトルチップ / ロックバスターのダメージ処理を接続する。\n7. プレイヤーHPへ進む。\n8. その後、敵AI・被弾・撃破・Wave進行へ拡張する。"
          new_priority = "1. ソード・ワイドソード・リカバリーでPが7×5図の中央マスに配置されることを確認する。\n2. キャノン・ミニボム等で中央配置だとRangeが見切れる場合、Range全体が収まる位置へPが自動補正されることを確認する。\n3. 攻撃範囲のマス境界一致と既存チップ詳細レイアウトが維持されていることを確認する。\n4. 配置編集バーとY方向固定のv65確認が未完なら合わせて確認する。\n5. 敵HPの最小基盤を追加する。\n6. バトルチップ / ロックバスターのダメージ処理を接続する。\n7. プレイヤーHPへ進む。\n8. その後、敵AI・被弾・撃破・Wave進行へ拡張する。"
          if old_priority not in text:
              raise SystemExit('priority list not found')
          text = text.replace(old_priority, new_priority, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit status and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-development-status-v71.yml
          git add DEVELOPMENT_STATUS.md
          git commit -m "Record centered chip detail range placement v71"
          git push origin main
