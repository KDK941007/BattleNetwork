name: Fix test chip image resolver v70

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-test-chip-image-resolver-v70.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route test chip artwork through image resolver
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p=Path('js/ui/test-chip-ui.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace("    art.innerHTML=chip.imagePath?`<img src=\"${chip.imagePath}\" alt=\"${chip.chipName}\" draggable=\"false\">`:'';", "    const imagePath=master.getChipImagePath(chip);\n    art.innerHTML=imagePath?`<img src=\"${imagePath}\" alt=\"${chip.chipName}\" draggable=\"false\">`:'';", 1)
          t=t.replace("    card.innerHTML=`\n      <span class=\"slotNo\">${slotNo}</span>\n      <span class=\"chipName\">${chip.chipName}</span>\n      <span class=\"chipArt\">${chip.imagePath?`<img src=\"${chip.imagePath}\" alt=\"${chip.chipName}\" draggable=\"false\">`:''}</span>", "    const imagePath=master.getChipImagePath(chip);\n    card.innerHTML=`\n      <span class=\"slotNo\">${slotNo}</span>\n      <span class=\"chipName\">${chip.chipName}</span>\n      <span class=\"chipArt\">${imagePath?`<img src=\"${imagePath}\" alt=\"${chip.chipName}\" draggable=\"false\">`:''}</span>", 1)
          if 'chip.imagePath' in t:
              raise SystemExit('test-chip-ui still contains chip.imagePath')
          p.write_text(t,encoding='utf-8')

          p=Path('index.html')
          t=p.read_text(encoding='utf-8').replace('./js/ui/test-chip-ui.js?v=32','./js/ui/test-chip-ui.js?v=70')
          p.write_text(t,encoding='utf-8')

          p=Path('sw.js')
          t=p.read_text(encoding='utf-8')
          t=re.sub(r"const CACHE_NAME = 'battlenetwork-runtime-v\d+';", "const CACHE_NAME = 'battlenetwork-runtime-v70';", t, count=1)
          p.write_text(t,encoding='utf-8')

          p=Path('DEVELOPMENT_STATUS.md')
          t=p.read_text(encoding='utf-8')
          marker='v69でチップ固有画像の管理を `M_CHIP.image_path` 方式から `assets/chips/{chip_name}.png` の命名規約方式へ移行した。'
          pos=t.find(marker)
          if pos<0: raise SystemExit('v69 status marker not found')
          line_end=t.find('\n',pos)
          insert='\nv70で最終確認時に残っていたテストチップUIの `chip.imagePath` 直接参照を解消し、正式チップと同じ `BattleNetworkMaster.getChipImagePath()` 経由へ統一した。正式マスタへ画像項目は戻さず、テスト用画像流用もサービス層の互換定義から解決する。v70は実機確認待ち。'
          t=t[:line_end]+insert+t[line_end:]
          p.write_text(t,encoding='utf-8')
          PY

          git rm '.github/workflows/fix-test-chip-image-resolver-v70.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish chip-name image resolver migration v70'
          git push
