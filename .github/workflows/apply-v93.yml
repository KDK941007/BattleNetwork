name: Apply v93 player defeat

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/apply_v93.py'
      - '.github/workflows/apply-v93.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v93
        run: python tools/apply_v93.py
      - name: Commit v93
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v93.yml tools/apply_v93.py
          git add js/game.js css/player-defeat.css index.html sw.js GAME_DESIGN.md DEVELOPMENT_STATUS.md
          git commit -m "Implement v93 player defeat flow"
          git push origin main
