name: Apply v89 cannon non-piercing
on:
  push:
    paths:
      - '.github/workflows/apply-v89.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply v89
        run: python3 tools/apply_v89.py
      - name: Commit v89
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Cannon non-piercing (v89)"
          git push
