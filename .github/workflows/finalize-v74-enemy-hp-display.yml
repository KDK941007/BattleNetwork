name: Finalize v74 enemy HP display status
on:
  push:
    paths:
      - '.github/workflows/finalize-v74-enemy-hp-display.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update development status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_STATUS.md')
          text=p.read_text()
          old="v73でテスト敵の最大HPを `200` に確定し、敵頭上へ `HP 現在値 / 最大値` の簡易表示を追加した。既存チップマスタの固定威力（キャノン40 / ソード80 / ワイドソード80 / ミニボム50）をv54で確定済みの命中タイミングへ接続し、敵HPを実際に減算する。B攻撃は `js/combat/b-attack-system.js` へ分離し、デフォルトプロファイルをロックバスター、Bタップ威力 `1`、B長押しチャージを通常威力の `10倍`（現行10）として定義した。Bタップ／長押しは別Actionとして保持し、`setActiveProfile()` で将来ソウルユニゾン・スタイルチェンジ・改造等から差し替え可能とした。競合時の優先順位は未確定のため実装していない。撃破削除はまだ行わず、HP0到達判定までとする。v73は実機確認待ち。"
          new=old[:-9]+"実機確認済み。\nv74で敵HP表示を原作寄りの残HP数字のみへ変更した。従来の `HP 現在値 / 最大値` と背景付き小ラベルを廃止し、白い太字数字＋黒縁、34pxの角張ったゲーム数字表現へ変更。表示位置比較のため同じ残HPを敵の頭上と足元の両方へ同時表示する。HP内部値・ダメージ処理は変更していない。v74は上下どちらを正式採用するかの実機比較待ち。"
          if old not in text:
              raise SystemExit('v73 status paragraph not found')
          text=text.replace(old,new,1)
          text=text.replace('## 次フェーズ: 実ダメージ確認 → プレイヤーHP','## 次フェーズ: 敵HP表示位置比較 → プレイヤーHP',1)
          old2='v71までのチップ詳細Range図は実機確認済み。v72で敵HP基盤、v73でテスト敵HP200・HP表示・チップ/B攻撃の実ダメージ接続と差し替え可能なB攻撃基盤を追加した。まずv73のダメージ値とHP表示を実機確認し、問題なければプレイヤーHPへ進む。'
          new2='v71までのチップ詳細Range図は実機確認済み。v72で敵HP基盤、v73でテスト敵HP200・チップ/B攻撃の実ダメージ接続と差し替え可能なB攻撃基盤を追加し、実機確認済み。v74では残HP表示を原作寄りへ変更し、上表示・下表示を同時に出して比較する。正式位置を決定後、プレイヤーHPへ進む。'
          if old2 in text:
              text=text.replace(old2,new2,1)
          p.write_text(text)
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_STATUS.md
          git commit -m 'Record v73 verification and v74 HP display comparison' || true
          git rm .github/workflows/finalize-v74-enemy-hp-display.yml
          git commit -m 'Remove one-time v74 status workflow'
          git push origin main
