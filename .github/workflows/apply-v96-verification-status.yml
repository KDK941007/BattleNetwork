name: Apply v96 verification status
on:
  push:
    paths:
      - '.github/workflows/apply-v96-verification-status.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v96 verification status
        run: python tools/apply_v96_verified_status.py
      - name: Commit status update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_STATUS.md
          git commit -m "Record v96 device verification" || exit 0
          git push
      - name: Remove one-time verification files
        run: |
          git rm tools/apply_v96_verified_status.py .github/workflows/apply-v96-verification-status.yml
          git commit -m "Remove one-time v96 verification files"
          git push
