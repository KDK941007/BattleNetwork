name: Confirm v80 device check
on:
  push:
    paths:
      - '.github/workflows/confirm-v80-device-check.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record v80 verification
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_STATUS.md')
          text=p.read_text()
          old="v80でMAX時の点滅表現を復活させる。ただし負荷原因だったゲージ全体への `filter:brightness()` と外側グローは戻さず、満タンの `customFill` のみを `opacity` 1.0 / 0.42 の2段階で点滅させる。`will-change: opacity` はREADY中のfillだけに限定し、READY解除時は通常へ戻す。枠・CUSTOM文字は静的READY色を維持する。ゲージ蓄積時間10秒・MAX時の再CUSTOM操作・位置・サイズは変更しない。v80は点滅時の実機負荷確認待ち。"
          new="v80でMAX時の点滅表現を復活させた。ただし負荷原因だったゲージ全体への `filter:brightness()` と外側グローは戻さず、満タンの `customFill` のみを `opacity` 1.0 / 0.42 の2段階で点滅させる。`will-change: opacity` はREADY中のfillだけに限定し、READY解除時は通常へ戻す。枠・CUSTOM文字は静的READY色を維持する。ゲージ蓄積時間10秒・MAX時の再CUSTOM操作・位置・サイズは変更していない。v80の点滅状態でも移動・旋回・ロックバスター連打を含めて動作上の問題がないことを実機確認済み。"
          if old not in text:
              raise SystemExit('v80 status marker not found')
          text=text.replace(old,new,1)
          text=text.replace('## 次フェーズ: v79実機確認 → プレイヤーHP','## 次フェーズ: プレイヤーHP',1)
          old_phase="v73のダメージ接続は実機確認済み。v76までCPU側の毎フレーム処理を軽量化しても連打時の重さが残ったため、v77では通常 / チャージバスターの床影DOM・移動発光・B押下filter・チャージ中発光・敵hit glow・HP多重shadowを外して描画負荷を切り分ける。まず実機で連打時の負荷を再確認し、問題なければプレイヤーHPへ進む。"
          new_phase="v78の専用Projectile Layer分離によりロックバスター連打時の重さは実機で改善確認済み。CUSTOMゲージMAX時の負荷もv79で重い `filter:brightness()` 点滅を除去して改善し、v80で `opacity` の軽量点滅を復活させた状態でも実機動作に問題なし。負荷対応はいったん完了扱いとし、次はプレイヤーHP基盤へ進む。"
          if old_phase in text:
              text=text.replace(old_phase,new_phase,1)
          p.write_text(text)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_STATUS.md
          git rm .github/workflows/confirm-v80-device-check.yml
          git commit -m 'Record v80 device verification'
          git push origin main
