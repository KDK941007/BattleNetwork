name: Apply v103 verification status

on:
  push:
    paths:
      - '.github/workflows/apply-v103-verification-status.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v103 verification status
        run: python tools/apply_v103_verified_status.py
      - name: Commit status update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_STATUS.md
          git diff --cached --quiet || git commit -m "Record v103 device verification"
          git push origin main
      - name: Remove one-time verification files
        run: |
          git pull --rebase origin main
          git rm tools/apply_v103_verified_status.py .github/workflows/apply-v103-verification-status.yml
          git commit -m "Remove one-time v103 verification files"
          git push origin main
