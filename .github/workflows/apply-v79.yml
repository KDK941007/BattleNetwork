name: Apply v79 custom gauge performance
on:
  push:
    paths:
      - '.github/workflows/apply-v79.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v79
        run: python tools/apply_v79.py
      - name: Commit v79
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/style.css index.html sw.js DEVELOPMENT_STATUS.md
          git commit -m 'Lighten CUSTOM ready rendering v79'
          git rm tools/apply_v79.py .github/workflows/apply-v79.yml
          git commit -m 'Remove one-time v79 patch files'
          git push origin main
