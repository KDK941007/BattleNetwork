name: Apply v88 enemy test attack
on:
  push:
    paths:
      - '.github/workflows/apply-v88.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v88
        run: python tools/apply_v88.py
      - name: Commit v88
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js DEVELOPMENT_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Connect first test enemy attack to player damage (v88)"
            git push
          fi
          git rm .github/workflows/apply-v88.yml tools/apply_v88.py
          git commit -m "Remove one-time v88 files"
          git push
