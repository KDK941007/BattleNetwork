name: Apply v78 buster projectile isolation
on:
  push:
    paths:
      - '.github/workflows/apply-v78.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v78
        run: python tools/apply_v78.py
      - name: Commit v78
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/game.js index.html sw.js DEVELOPMENT_STATUS.md
          git commit -m 'Isolate buster projectiles from scene v78'
          git rm tools/apply_v78.py .github/workflows/apply-v78.yml
          git commit -m 'Remove one-time v78 patch files'
          git push origin main
