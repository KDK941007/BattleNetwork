name: Apply v93 verification status
on:
  push:
    paths:
      - 'tools/apply_v93_verification.py'
      - '.github/workflows/apply-v93-verification.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v93 verification
        run: python tools/apply_v93_verification.py
      - name: Commit v93 verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_STATUS.md
          git commit -m "Record v93 device verification"
          git push
      - name: Remove one-time verification files
        run: |
          git rm tools/apply_v93_verification.py .github/workflows/apply-v93-verification.yml
          git commit -m "Remove one-time v93 verification files"
          git push
