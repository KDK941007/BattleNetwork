name: Apply v103 enemy damage performance
on:
  push:
    paths:
      - '.github/workflows/apply-v103-enemy-damage-perf.yml'
      - 'tools/apply_v103_enemy_damage_perf.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v103
        run: python tools/apply_v103_enemy_damage_perf.py
      - name: Syntax check
        run: node --check js/combat/enemy-foundation.js
      - name: Sanity check
        run: |
          grep -q "enemyPrototypeHitFlash" js/combat/enemy-foundation.js
          grep -q "enemy-foundation.js?v=103" index.html
          grep -q "battlenetwork-runtime-v103" sw.js
          grep -q "v103 敵被ダメージ描画負荷" DEVELOPMENT_STATUS.md
          ! grep -q "brightness(2.35)" js/combat/enemy-foundation.js
      - name: Commit v103
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/combat/enemy-foundation.js index.html sw.js DEVELOPMENT_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Optimize enemy damage feedback rendering v103"
            git push origin main
          fi
      - name: Remove one-time v103 files
        run: |
          git pull --rebase origin main
          git rm tools/apply_v103_enemy_damage_perf.py .github/workflows/apply-v103-enemy-damage-perf.yml
          git commit -m "Remove one-time v103 performance files"
          git push origin main
