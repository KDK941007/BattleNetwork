name: Fix v93 status consistency

on:
  push:
    paths:
      - 'tools/fix_v93_status.py'
      - '.github/workflows/fix-v93-status.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix v93 status
        run: python tools/fix_v93_status.py
      - name: Commit status fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_STATUS.md
          git commit -m "Fix v93 verification history"
          git push
      - name: Remove one-time files
        run: |
          git rm tools/fix_v93_status.py .github/workflows/fix-v93-status.yml
          git commit -m "Remove one-time v93 status files"
          git push
