name: Apply v97 wave transition
on:
  push:
    paths:
      - '.github/workflows/apply-v97-wave-transition.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v97
        run: python tools/apply_v97_wave_transition.py
      - name: Syntax check
        run: |
          node --check js/combat/enemy-foundation.js
          node --check js/combat/wave-system.js
          node --check js/game.js
      - name: Commit v97
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/combat/enemy-foundation.js js/combat/wave-system.js js/game.js index.html sw.js GAME_DESIGN.md DEVELOPMENT_STATUS.md
          git commit -m "Connect inter-wave CUSTOM flow (v97)"
          git push
      - name: Remove one-time v97 files
        run: |
          git pull --rebase
          git rm tools/apply_v97_wave_transition.py .github/workflows/apply-v97-wave-transition.yml
          git commit -m "Remove one-time v97 transition files"
          git push
