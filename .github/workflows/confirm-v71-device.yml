name: Confirm v71 device verification
on:
  push:
    paths:
      - '.github/workflows/confirm-v71-device.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update DEVELOPMENT_STATUS
        shell: python
        run: |
          from pathlib import Path
          p = Path('DEVELOPMENT_STATUS.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('v71は実機確認待ち。', 'v71は実機確認済み。')
          s = s.replace('- v71チップ詳細Range図のP中央優先配置と見切れ時自動補正の実機確認。\n', '')
          s = s.replace('v71でPを中央優先・見切れ時のみ自動補正する表示へ更新したため、まずv71の配置を実機確認し、問題なければ敵HP・ダメージ処理の最小基盤へ進む。', 'v71でPを中央優先・見切れ時のみ自動補正する表示へ更新し、実機確認済み。次は敵HP・ダメージ処理の最小基盤へ進む。')
          s = s.replace('1. ソード・ワイドソード・リカバリーでPが7×5図の中央マスに配置されることを確認する。\n2. キャノン・ミニボム等で中央配置だとRangeが見切れる場合、Range全体が収まる位置へPが自動補正されることを確認する。\n3. 攻撃範囲のマス境界一致と既存チップ詳細レイアウトが維持されていることを確認する。\n4. 配置編集バーとY方向固定のv65確認が未完なら合わせて確認する。\n5. 敵HPの最小基盤を追加する。\n6. バトルチップ / ロックバスターのダメージ処理を接続する。\n7. プレイヤーHPへ進む。\n8. その後、敵AI・被弾・撃破・Wave進行へ拡張する。', '1. 配置編集バーとY方向固定のv65確認が未完なら合わせて確認する。\n2. 敵HPの最小基盤を追加する。\n3. バトルチップ / ロックバスターのダメージ処理を接続する。\n4. プレイヤーHPへ進む。\n5. その後、敵AI・被弾・撃破・Wave進行へ拡張する。')
          p.write_text(s, encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_STATUS.md
          git commit -m "Record v71 device verification" || true
          git rm .github/workflows/confirm-v71-device.yml
          git commit -m "Remove one-time v71 verification workflow" || true
          git push origin main
