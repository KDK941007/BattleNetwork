name: Apply v99 wave presentation

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_v99.py'
      - '.github/workflows/apply-v99-wave-presentation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v99
        run: python tools/apply_v99.py
      - name: Syntax check
        run: node --check js/combat/wave-system.js
      - name: Commit v99
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/wave-status.css js/combat/wave-system.js index.html sw.js GAME_DESIGN.md DEVELOPMENT_STATUS.md
          git commit -m "Implement v99 wave transition presentation"
          git push origin main
      - name: Remove one-time v99 files
        run: |
          git pull --ff-only origin main
          git rm tools/apply_v99.py .github/workflows/apply-v99-wave-presentation.yml
          git commit -m "Remove one-time v99 presentation files"
          git push origin main
