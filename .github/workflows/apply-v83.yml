name: Apply v83 player HUD resize
on:
  push:
    paths:
      - '.github/workflows/apply-v83.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v83
        run: python tools/apply_v83.py
      - name: Commit v83
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js DEVELOPMENT_STATUS.md
          git commit -m 'Finalize compact player HUD v83'
          git rm tools/apply_v83.py .github/workflows/apply-v83.yml
          git commit -m 'Remove one-time v83 patch files'
          git push origin main
