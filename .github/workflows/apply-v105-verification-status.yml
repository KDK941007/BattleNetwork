name: Apply v105 verification status

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_v105_verified_status.py'
      - '.github/workflows/apply-v105-verification-status.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v105 verification status
        run: python tools/apply_v105_verified_status.py
      - name: Commit status update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_STATUS.md
          git diff --cached --quiet || git commit -m "Record v105 device verification"
          git push
      - name: Remove one-time verification files
        run: |
          git pull --rebase origin main
          git rm tools/apply_v105_verified_status.py .github/workflows/apply-v105-verification-status.yml
          git commit -m "Remove one-time v105 verification files"
          git push
