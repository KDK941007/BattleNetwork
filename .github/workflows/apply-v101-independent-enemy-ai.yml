name: Apply v101 independent enemy AI

on:
  push:
    paths:
      - 'tools/apply_v101_independent_enemy_ai.py'
      - '.github/workflows/apply-v101-independent-enemy-ai.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v101
        run: python tools/apply_v101_independent_enemy_ai.py

      - name: Syntax check
        run: node --check js/combat/enemy-ai-system.js

      - name: Sanity check
        run: |
          grep -q "INDEPENDENT_PER_ENEMY" js/combat/enemy-ai-system.js
          grep -q "enemy-ai-system.js?v=101" index.html
          grep -q "battlenetwork-runtime-v101" sw.js
          grep -q "v101 敵の独立行動ルール" GAME_DESIGN.md
          grep -q "v101 敵AI独立行動 実機確認" DEVELOPMENT_STATUS.md

      - name: Commit v101
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/combat/enemy-ai-system.js index.html sw.js GAME_DESIGN.md DEVELOPMENT_STATUS.md
          git commit -m "Implement v101 independent enemy AI" || true
          git push origin main

      - name: Remove one-time v101 files
        run: |
          git pull --rebase origin main
          git rm tools/apply_v101_independent_enemy_ai.py .github/workflows/apply-v101-independent-enemy-ai.yml
          git commit -m "Remove one-time v101 files"
          git push origin main
