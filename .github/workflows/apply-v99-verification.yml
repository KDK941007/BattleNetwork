name: Apply v99 verification status
on:
  push:
    paths:
      - '.github/workflows/apply-v99-verification.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v99 verification status
        run: python tools/apply_v99_verified_status.py
      - name: Commit status update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_STATUS.md
          git commit -m "Record v99 device verification"
          git push
      - name: Remove one-time verification files
        run: |
          git pull --rebase
          git rm tools/apply_v99_verified_status.py .github/workflows/apply-v99-verification.yml
          git commit -m "Remove one-time v99 verification files"
          git push
