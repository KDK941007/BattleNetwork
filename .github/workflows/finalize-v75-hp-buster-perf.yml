name: Finalize v75 HP and buster performance status
on:
  push:
    paths:
      - '.github/workflows/finalize-v75-hp-buster-perf.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update development status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_STATUS.md')
          text=p.read_text()
          v74="v74で敵HP表示を原作寄りの残HP数字のみへ変更した。従来の `HP 現在値 / 最大値` と背景付き小ラベルを廃止し、白い太字数字＋黒縁、34pxの角張ったゲーム数字表現へ変更。表示位置比較のため同じ残HPを敵の頭上と足元の両方へ同時表示する。HP内部値・ダメージ処理は変更していない。v74は上下どちらを正式採用するかの実機比較待ち。"
          v75=v74+"\nv75で敵HP表示位置は足元側を正式採用し、頭上表示を削除した。残HP数字は34pxから40pxへ一回り拡大し、白太字＋黒縁の原作寄り表現を維持する。また実機でロックバスター発射時の画面負荷を確認したため、`projectile-shadow-renderer.js` の弾ごとの `MutationObserver` を廃止し、弾が存在する間だけ1本の `requestAnimationFrame` ループで影を同期する方式へ変更。発射時の `offsetWidth / offsetHeight` 読み取りも固定表示サイズ参照へ置き換え、強制レイアウトを避ける。攻撃力・連射間隔・弾速・命中判定は変更していない。v75のHP表示とロックバスター負荷改善は実機確認待ち。"
          if v74 not in text: raise SystemExit('v74 paragraph not found')
          text=text.replace(v74,v75,1)
          old="- v73のテスト敵最大HPは200。頭上に現在HP / 最大HPを表示し、`applyDamage()` により実ダメージを反映する。"
          new="- テスト敵最大HPは200。v75では残HP数字のみを敵の足元側に40pxで表示し、`applyDamage()` により実ダメージを反映する。"
          if old not in text: raise SystemExit('enemy HP summary not found')
          text=text.replace(old,new,1)
          old_phase="## 次フェーズ: 敵HP表示位置比較 → プレイヤーHP\n\nv71までのチップ詳細Range図は実機確認済み。v72で敵HP基盤、v73でテスト敵HP200・チップ/B攻撃の実ダメージ接続と差し替え可能なB攻撃基盤を追加し、実機確認済み。v74では残HP表示を原作寄りへ変更し、上表示・下表示を同時に出して比較する。正式位置を決定後、プレイヤーHPへ進む。\n\n優先対象は以下。\n\n1. キャノン40 / ソード80 / ワイドソード80 / ミニボム50でHP200から正しく減算されることを確認する。\n2. デフォルトロックバスターのBタップが1、チャージが10ダメージになることを確認する。\n3. 敵頭上のHP表示が現在HP / 最大HPとして更新されることを確認する。\n4. 配置編集バーとY方向固定のv65確認が未完なら合わせて確認する。\n5. プレイヤーHPへ進む。\n6. その後、敵AI・被弾・撃破・Wave進行へ拡張する。"
          new_phase="## 次フェーズ: v75実機確認 → プレイヤーHP\n\nv73のダメージ接続は実機確認済み。v75で敵HP表示を足元側へ確定し40pxへ拡大、ロックバスター発射時の負荷対策として弾影追従処理を軽量化した。まず実機で表示と負荷改善を確認し、問題なければプレイヤーHPへ進む。\n\n優先対象は以下。\n\n1. 敵の残HPが足元側だけに40pxで表示され、ダメージ時に正しく更新されることを確認する。\n2. 通常ロックバスター／チャージショット発射時の移動・旋回・画面描画負荷が改善していることを確認する。\n3. キャノンの床影表示に退行がないことも合わせて確認する。\n4. 配置編集バーとY方向固定のv65確認が未完なら合わせて確認する。\n5. プレイヤーHPへ進む。\n6. その後、敵AI・被弾・撃破・Wave進行へ拡張する。"
          if old_phase not in text: raise SystemExit('next phase block not found')
          text=text.replace(old_phase,new_phase,1)
          p.write_text(text)
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_STATUS.md
          git commit -m 'Document v75 HP and buster performance changes'
          git rm .github/workflows/finalize-v75-hp-buster-perf.yml
          git commit -m 'Remove one-time v75 status workflow'
          git push origin main
