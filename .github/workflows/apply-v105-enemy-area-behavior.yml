name: Apply v105 enemy area behavior
on:
  push:
    paths:
      - 'tools/apply_v105_enemy_area_behavior.py'
      - '.github/workflows/apply-v105-enemy-area-behavior.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v105
        run: python tools/apply_v105_enemy_area_behavior.py
      - name: Syntax check
        run: |
          node --check js/combat/enemy-attack-layer.js
          node --check js/combat/enemy-behavior-target-area.js
          node --check js/combat/wave-system.js
      - name: Sanity check
        run: |
          grep -q "PROTOTYPE_TARGET_AREA" js/combat/enemy-behavior-target-area.js
          grep -q "createAreaMarker" js/combat/enemy-attack-layer.js
          grep -q "enemy-behavior-target-area.js?v=105" index.html
          grep -q "battlenetwork-runtime-v105" sw.js
          grep -q "v105 別Attack Behavior 実機確認" DEVELOPMENT_STATUS.md
          grep -q "v105 別Attack Behavior差し替え検証" GAME_DESIGN.md
      - name: Commit v105
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/combat/enemy-attack-layer.js js/combat/enemy-behavior-target-area.js js/combat/wave-system.js index.html sw.js DEVELOPMENT_STATUS.md GAME_DESIGN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Implement v105 alternate enemy attack behavior"
          git push origin main
      - name: Remove one-time v105 files
        if: always()
        run: |
          git pull --rebase origin main
          rm -f tools/apply_v105_enemy_area_behavior.py .github/workflows/apply-v105-enemy-area-behavior.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove one-time v105 files"
          git push origin main
