name: Apply v92 verification status

on:
  push:
    paths:
      - 'tools/apply_v92_verification.py'
      - '.github/workflows/apply-v92-verification.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v92 verification
        run: python tools/apply_v92_verification.py
      - name: Commit v92 verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_STATUS.md
          git commit -m "Record v92 device verification" || true
          git rm tools/apply_v92_verification.py .github/workflows/apply-v92-verification.yml
          git commit -m "Remove one-time v92 verification files"
          git push origin main
