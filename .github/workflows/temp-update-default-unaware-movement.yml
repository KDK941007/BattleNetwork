name: One-time unaware movement design update
on:
  push:
    paths:
      - '.github/workflows/temp-update-default-unaware-movement.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update GAME_DESIGN and remove helper
        shell: python
        run: |
          from pathlib import Path
          p = Path('GAME_DESIGN.md')
          s = p.read_text(encoding='utf-8')
          old = '- プレイヤーが知覚範囲外にいる間は、原則としてその敵固有の待機・巡回等を行い、プレイヤーを直接狙う追跡・攻撃行動へ移らない。'
          new = '- プレイヤーを知覚していない間の共通デフォルト行動は、プレイヤーを直接追跡・攻撃せず、フィールド内を自由移動するものとする。未知覚時の移動方法は敵タイプごとに個別上書き可能とし、固定砲台のような移動しない敵、巡回ルートを持つ敵、待機中心の敵などは敵固有仕様として変更できる。'
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/temp-update-default-unaware-movement.yml').unlink()
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GAME_DESIGN.md .github/workflows/temp-update-default-unaware-movement.yml
          git commit -m 'Define default unaware enemy movement'
          git push
