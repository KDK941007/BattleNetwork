name: Apply v81 player HP foundation
on:
  push:
    paths:
      - '.github/workflows/apply-v81.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v81
        run: python tools/apply_v81.py
      - name: Commit v81
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js DEVELOPMENT_STATUS.md
          git commit -m 'Wire player HP foundation v81'
          git rm tools/apply_v81.py .github/workflows/apply-v81.yml
          git commit -m 'Remove one-time v81 patch files'
          git push origin main
