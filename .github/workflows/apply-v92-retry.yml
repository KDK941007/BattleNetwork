name: Apply v92 flinch retry

on:
  push:
    paths:
      - '.github/workflows/apply-v92-retry.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v92 retry
        run: python tools/apply_v92_retry.py
      - name: Commit v92
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/game.js js/combat/player-damage-system.js index.html sw.js GAME_DESIGN.md DEVELOPMENT_STATUS.md
          git commit -m "Add player flinch state (v92)"
          git rm tools/apply_v92.py .github/workflows/apply-v92.yml tools/apply_v92_retry.py .github/workflows/apply-v92-retry.yml
          git commit -m "Remove one-time v92 files"
          git push origin main
