name: Apply v85 HUD alignment
on:
  push:
    paths:
      - '.github/workflows/apply-v85.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v85
        run: python tools/apply_v85.py
      - name: Commit v85
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js DEVELOPMENT_STATUS.md
          git commit -m 'Finalize player HUD alignment v85'
          git rm tools/apply_v85.py .github/workflows/apply-v85.yml
          git commit -m 'Remove one-time v85 files'
          git push origin main
