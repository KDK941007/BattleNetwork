name: Fix v77 status
on:
  push:
    paths:
      - '.github/workflows/fix-v77-status.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_STATUS.md')
          text=p.read_text()
          text=text.replace('- キャノン / 通常ロックバスター / チャージショットは床面world座標を示す影を表示する。','- キャノンは床面world座標を示す影を表示する。通常ロックバスター / チャージショットの床影はv77の負荷切り分けで一旦撤去中。',1)
          text=text.replace('v73のダメージ接続は実機確認済み。v75の初回負荷対策後もロックバスター連打時の重さが残ったため、v76で弾本体・影・敵Hit判定の毎フレーム経路をさらに軽量化した。まず実機で連打時の負荷を再確認し、問題なければプレイヤーHPへ進む。','v73のダメージ接続は実機確認済み。v76までCPU側の毎フレーム処理を軽量化しても連打時の重さが残ったため、v77では通常 / チャージバスターの床影DOM・移動発光・B押下filter・チャージ中発光・敵hit glow・HP多重shadowを外して描画負荷を切り分ける。まず実機で連打時の負荷を再確認し、問題なければプレイヤーHPへ進む。',1)
          p.write_text(text)
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_STATUS.md
          git commit -m 'Align v77 performance status'
          git rm .github/workflows/fix-v77-status.yml
          git commit -m 'Remove one-time v77 status cleanup'
          git push origin main
