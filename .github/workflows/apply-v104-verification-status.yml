name: Apply v104 verification status

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_v104_verification_status.py'
      - '.github/workflows/apply-v104-verification-status.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v104 verification status
        run: python tools/apply_v104_verification_status.py
      - name: Commit status update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_STATUS.md
          git diff --cached --quiet || git commit -m "Record v104 device verification"
          git push origin main
      - name: Remove one-time verification files
        run: |
          git rm tools/apply_v104_verification_status.py .github/workflows/apply-v104-verification-status.yml
          git commit -m "Remove one-time v104 verification files"
          git push origin main
