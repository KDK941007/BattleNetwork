name: Apply v94 enemy defeat

on:
  push:
    paths:
      - 'tools/apply_v94.py'
      - '.github/workflows/apply-v94.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v94
        run: python tools/apply_v94.py
      - name: Commit v94
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/combat/enemy-foundation.js index.html sw.js GAME_DESIGN.md DEVELOPMENT_STATUS.md
          git commit -m "Implement v94 enemy defeat flow"
          git push
      - name: Remove one-time v94 files
        run: |
          git rm tools/apply_v94.py .github/workflows/apply-v94.yml
          git commit -m "Remove one-time v94 files"
          git push
