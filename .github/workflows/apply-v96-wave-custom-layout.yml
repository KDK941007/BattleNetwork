name: Apply v96 Wave CUSTOM layout

on:
  push:
    paths:
      - '.github/workflows/apply-v96-wave-custom-layout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v96 layout
        run: python tools/apply_v96_wave_custom_layout.py
      - name: Commit v96 layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css css/wave-status.css index.html sw.js DEVELOPMENT_STATUS.md
          git commit -m "Adjust Wave and CUSTOM layout (v96)"
          git push
      - name: Remove one-time v96 files
        run: |
          git pull --rebase
          rm -f tools/apply_v96_wave_custom_layout.py .github/workflows/apply-v96-wave-custom-layout.yml
          git add -A
          git commit -m "Remove one-time v96 layout files"
          git push
