name: Apply v100 enemy AI foundation

on:
  push:
    paths:
      - 'tools/apply_v100_enemy_ai_foundation.py'
      - '.github/workflows/apply-v100-enemy-ai.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v100
        run: python tools/apply_v100_enemy_ai_foundation.py
      - name: Syntax check
        run: |
          node --check js/combat/enemy-ai-system.js
          node --check js/combat/enemy-behavior-straight-shot.js
          node --check js/combat/wave-system.js
      - name: Sanity check wiring
        run: |
          grep -q 'enemy-ai-system.js?v=100' index.html
          grep -q 'enemy-behavior-straight-shot.js?v=100' index.html
          grep -q 'wave-system.js?v=100' index.html
          ! grep -q 'enemy-test-attack.js' index.html
          grep -q "battlenetwork-runtime-v100" sw.js
          test ! -e js/combat/enemy-test-attack.js
      - name: Commit v100
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement v100 enemy AI foundation'
          git push origin main
      - name: Remove one-time v100 files
        run: |
          git rm tools/apply_v100_enemy_ai_foundation.py .github/workflows/apply-v100-enemy-ai.yml
          git commit -m 'Remove one-time v100 files'
          git push origin main
