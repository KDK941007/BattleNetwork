name: Apply v91 hit invincibility

on:
  push:
    paths:
      - 'tools/apply_v91.py'
      - '.github/workflows/apply-v91.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v91
        run: python tools/apply_v91.py
      - name: Commit v91
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js GAME_DESIGN.md DEVELOPMENT_STATUS.md
          git commit -m "Add post-hit invincibility (v91)"
          git rm tools/apply_v91.py .github/workflows/apply-v91.yml
          git commit -m "Remove one-time v91 files"
          git push origin main
